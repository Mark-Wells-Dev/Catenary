# ── Publisher-discipline metadata (diagnostics-debt 04) ──────────────────────
#
# One `[discipline.<server>]` per blessed server whose adapter needs casing —
# the misc-157 profile table, made manifest data. These are platform-agnostic
# (discipline is a behavior of the server binary, not the host it ran on) and
# carry what the daemon needs to run the full diagnostics adapter: the publisher
# discipline (pull/event/debounce/scan/diff), declared constants (the debounce
# window), the capability casing (withhold the pull capability, force/forbid
# init options, declare push), and the message-compression line-strip rules.
#
#   [discipline.<server>]
#   discipline = "event"                  # pull | event | debounce | scan | diff
#   debounce_ms = 300                     # declared window for a debounce server
#   suppress_pull = true                  # withhold textDocument.diagnostic
#   declares_push = true                  # contractual publish per didOpen
#   single_file = "enrichment-only"       # rootless (null-rootUri) capability:
#                                         # unsupported (absent — fail closed,
#                                         # never spawned rootless) |
#                                         # enrichment-only | serves-diagnostics
#                                         # (brackets 01)
#   forbidden_init_options = ["..."]      # keys enforced absent post-merge
#   forced_init_options = { key = false } # options overlaid, winning over user
#   compress_versions = ["1."]            # version prefixes the strip rules pin
#   [[discipline.<server>.compress]]      # a line-strip rule (whole-line delete)
#   prefix = "for further information visit"
#
# The compression engine (src/filter) has fixed, narrow semantics: a message
# LINE whose trimmed text matches a rule is deleted whole; a message left empty
# after stripping drops entirely; nothing is rewritten or injected; an
# out-of-pin version is pass-through. The mandate is compression, never verdict
# policy — the strip+preserve conformance fixtures assert both directions
# against the pin, so a rule that ate verdict text would fail the gate before it
# shipped (misc 165's ruling). A server absent from this table carries the empty
# discipline: no casing, no compression. An UNVERIFIED custom def (absent from
# the blessed set entirely) is enrichment-only and never a diagnostics source.

# rust-analyzer — push-first for the Rust family (RA #18709): the native pushes
# are the sole diagnostic channel, so the pull capability is withheld. The
# clippy/rustc boilerplate strip rules (formerly hand-coded in
# src/filter/rust_analyzer.rs) are pinned to the 1.x line.
[discipline.rust-analyzer]
discipline = "event"
suppress_pull = true
compress_versions = ["1."]

# Project-config-file convention (misc 202): rust-analyzer reads per-project
# settings (flycheck command, cargo features, …) from `rust-analyzer.toml` at the
# project root. The `SessionStart` setup nudge fires once per root when a served
# Rust project has none — the lint/feature surface the editor and the receipt see
# may then not match the build. Advisory metadata only; no diagnostics seam reads
# it.
[discipline.rust-analyzer.project_config]
file = "rust-analyzer.toml"
docs = "https://rust-analyzer.github.io/manual.html#configuration"

# Clippy "for further information visit https://..." URL lines.
[[discipline.rust-analyzer.compress]]
prefix = "for further information visit"

# Rustc/clippy lint attribution: "`#[warn(...)]` on by default" etc.
[[discipline.rust-analyzer.compress]]
prefix = "`#["
contains_any = ["on by default", "implied by", "to override"]

# Standalone `-W` flag attribution: "`-W clippy::...` implied by ...".
[[discipline.rust-analyzer.compress]]
prefix = "`-W "
contains_all = ["implied by"]

# Standalone override instruction: "to override `-W ...` add `#[allow(...)]`".
[[discipline.rust-analyzer.compress]]
prefix = "to override"
contains_any = ["`#[allow(", "`#[warn("]

# gopls — PULL discipline (diagnostics-debt 05, re-enabling bug 87's suppression).
# Bug 87 forced `pullDiagnostics` FALSE because in pull mode gopls stopped real
# pushes and published empty placeholders that the then-unconditional heard-empty
# rule (misc 153) read as authoritative — so the pull that would fetch the real
# results was suppressed and dirty files read `[clean]`. Ledger 03's version-echo
# settlement retired that defeat STRUCTURALLY: an unversioned empty placeholder
# echoes no version, so it settles nothing — the debt stays open and the pull
# (`textDocument/diagnostic`) is what settles it, pull-first. So the suppression
# is lifted (no `pullDiagnostics = false`) and gopls rides its native pull mode,
# conformance-gated against the pin (`conformance_gopls_pull_mode`).
# `diagnosticsDelay` stays enforced ABSENT (run 9): at "0s" the coupling between
# analysis completion and publishing breaks, so only gopls's own default may apply.
[discipline.gopls]
discipline = "pull"
forbidden_init_options = ["diagnosticsDelay"]
# single_file: maintainer-ruled 2026-07-20 on the brackets-07 rootless probes
# (v0.22.0, matches pin): true positive 0.2 s no go.mod (IncompatibleAssign),
# explicit [] clean, same-package sibling + stdlib import resolve (no false
# "undefined"), //go:build ignore does not suppress. Non-sibling module
# reach-outs stay the rooted tier's job.
single_file = "serves-diagnostics"

# lattice — declared push (misc 187): the contract, pinned cross-repo in misc
# 153 / Lattice ticket 16 / its decision 022 and re-verified per re-pin, is a
# publish on EVERY didOpen (unchanged files included), explicit `[]` for clean.
# The retrieval evidence bar arms on this declaration from turn zero.
[discipline.lattice]
discipline = "event"
declares_push = true
# single_file (brackets 01; re-verified brackets 06): markdown is
# per-file-natured — a stray note or README outside any root. The claim STAYS
# at enrichment-only, now on observed evidence rather than caution: the
# conformance suite's single-file leg (2026-07-20) opened a lone dirty
# broken.md under a null-root session and NO publish arrived within 60 s and
# no on-demand pull was answered — the publish-per-didOpen contract above
# does not extend to null-root sessions. Never serves-diagnostics without a
# positive re-probe.
single_file = "enrichment-only"

# typescript-language-server — DEBOUNCE discipline (diagnostics-debt 05). ts-ls
# is a push-only publisher (no textDocument/diagnostic pull) whose first
# didOpen/didSave diagnostic lands on an internal debounce timer AFTER the process
# has gone scheduler-idle — the exact settle/publish gap that made it
# `conformance = false` (tui-rework 13). Ledger 05's declared-constant gate closes
# it: the ledger AWAITS the version echo bounded by this declared constant, never
# interpreting silence. The window is the DESIGN's pinned range upper bound
# (300–800 ms + 50 ms); `debounce_ms = 850` is the constant the gate awaits, data
# riding the pin and re-verified at every re-pin. The un-exemption rides this gate
# (`conformance_typescript_ls`).
[discipline.typescript-language-server]
discipline = "debounce"
debounce_ms = 850
# single_file: maintainer-ruled 2026-07-20 on the brackets-07 rootless probes
# (5.3.0, matches pin): true positive 0.8 s no tsconfig (TS2322), explicit []
# clean, relative sibling import resolves while a genuinely-missing module
# correctly errors (TS2307) — tsserver inferred projects per spec.
single_file = "serves-diagnostics"

# ── The rest of the blessed fleet (misc 196) ─────────────────────────────────
#
# Every blessed server carries a discipline row — the misc-196 ruling: a blessed
# server WITHOUT a row got the most-trusting treatment (its silence read
# `[clean]` through the misc-153 residual), inverting the manifest's "missing data
# only ever makes Catenary noisier" doctrine. The `blessed_servers_all_rowed`
# invariant test (src/recipes.rs) enforces `blessed ⊆ rowed` structurally, so a
# future blessing without a row fails CI.
#
# Evidence bar (misc 196 ruling): a bare `discipline = "event"` row is grounded by
# the server's conformance-green history (green means it demonstrably published
# its fixture's intentional diagnostic). Trust-INCREASING claims (`declares_push`,
# scan/diff/debounce constants) are set only where verified directly against the
# real binary, cited in the row comment. Servers not on this host's PATH ship the
# conformance-grounded bare `event` row with a note that the stronger contract is
# unverified.

# taplo — event + DECLARED PUSH (misc 196 verified live 2026-07-14 against taplo
# 0.10.0 `lsp stdio`; closes misc 194's verify-then-declare candidate). Direct
# probe: taplo publishes UNVERSIONED on didOpen — an explicit empty `[]` for a
# clean file AND the syntax diagnostic for a broken one, ~1.3 s after open, once
# the client answers taplo's `workspace/configuration` request (an unanswered
# config request blocks the publish — the earlier "publishes nothing" reading was
# a probe that skipped the config reply). No `diagnosticProvider`; the pull answers
# `-32601`. The publish-per-didOpen-including-clean IS the misc-187 `declares_push`
# contract, so declaring it arms the retrieval evidence bar from turn zero and
# closes misc 194's double-miss window structurally (the late unversioned publish
# no longer races a `[clean]` residual). This is exactly the sharpened candidate
# misc 194 named, now verified.
# taplo — verified single-file (brackets 06): TOML is per-file-natured
# (a lone Cargo.toml or project config in a stray path). Verified live
# 2026-07-20 by the conformance suite's single-file leg.
[discipline.taplo]
discipline = "event"
declares_push = true
single_file = "serves-diagnostics"

# tombi — BLESSED (misc 207, dual-bless-and-watch, PULL lane; 2026-07-21).
# The lane: tombi's discipline is CLIENT-SELECTED (source-level read of
# tombi-lsp at v1.2.4) — `DiagnosticMode::Pull` iff the client advertises
# `textDocument.diagnostic.dynamicRegistration`, versioned push otherwise. The
# ruled PULL lane is selected by `advertise_pull_dynamic_registration = true`:
# the capability casing that flips ONLY tombi's initialize to
# `dynamicRegistration: true` (every other server keeps today's `false`; the
# mechanics and the per-server-safety are pinned in
# src/lsp/server_behavior.rs).
[discipline.tombi]
discipline = "pull"
advertise_pull_dynamic_registration = true
# single_file (brackets 01; upgraded brackets 06): TOML is overwhelmingly
