# The blessed-manifest — the committed record of servers that have PASSED the
# CI conformance gate. This is the ONLY recipe-derived data a user surface is
# ever allowed to consult (the suggestion/fix-it surface ships later, in
# tickets 03/06); recipe DRAFTS (defaults/recipes.toml) never appear here.
#
# Format — one `[blessed.<server>]` per conformed server, keyed by the same
# canonical name as `defaults/servers.toml`:
#
#   [blessed.<server>]
#   version  = "1.2.3"            # the exact version that conformed
#   platform = "linux-x86_64"     # where the conformance job ran
#   date     = "2026-07-07"       # ISO date the green job landed
#   tier     = "verified-on-linux"  # honesty tier (initial tier; expands on
#                                    # sightings, decision-030 style)
#
# UPDATE FLOW (no auto-push — the human blesses by merging):
#   1. A conformance matrix job (.github/workflows/conformance.yml) installs the
#      pinned server and runs the harness with CATENARY_CONFORMANCE=<server>.
#   2. On green, the job emits its `[blessed.<server>]` entry as a build
#      artifact; an aggregate step combines the per-server entries and uploads
#      the merged manifest as a PR artifact and prints it in the job summary.
#   3. A human reviews the refresh-recipes PR (new pins + their conformance
#      results together) and commits the updated manifest into this file. Nothing
#      is pushed automatically — blessing IS that human merge.
#
# First blessing: 2026-07-08, from workflow_dispatch run 28948357654 (the
# matrix's first green subset — 13 servers). Recipe-backed entries become
# offerable via BlessedRecipe (manifest+recipe version match); provisioned
# entries (clangd, lattice, lua-ls, rust-analyzer) record config-conformance
# only and are structurally unofferable (no recipe). Host-riding provisions
# carry their verbatim `--version` line — honest, if verbose.

[blessed.bash-ls]
version = "5.6.0"
platform = "linux-x86_64"
date = "2026-07-08"
tier = "verified-on-linux"

