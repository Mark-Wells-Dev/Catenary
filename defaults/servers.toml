# Built-in server definitions.
#
# Loaded as the lowest-priority config layer. User and project
# `[lsp.server.*]` entries completely replace the built-in default for
# that name — no merging.
#
# The server KEY is the executable Catenary spawns (misc 162): the key is
# the upstream project's published binary name (`bash-language-server`,
# `svelteserver`, `docker-langserver`), or the runtime the server rides
# (`dart`, `julia`, `R` — case-sensitive). There is no `command` field —
# a config that sets one is rejected with a teaching error. To relocate a
# binary that is not on `PATH` under its key, set an optional absolute
# `path` (relocation, never renaming — the key stays the identity).
#
# Mostly only `args` are defined here; `initialization_options`,
# `settings`, `env`, and other fields are user preferences.
#
# Diagnostic source weights (misc 115) are co-located on the source definition:
# as of linters ticket 05 a `[lsp.server.*]` may set `weight` (native-source
# trust), a `[lsp.server.*.sources]` sub-table (per-sub-source overrides, e.g.
# flycheck `rustc`/`clippy`), and `provisional` (the native source's provisional
# code band). The rust-analyzer / flycheck default (`rust-analyzer = 10`,
# `rustc`/`clippy = 100`, provisional `^E[0-9]+$`) ships in code
# (`DiagnosticWeights::rust_analyzer_default`), not here, so it survives a user
# redefining `[lsp.server.rust-analyzer]`, and is keyed on the LSP `source` field,
# so it is inert for any root whose diagnostics carry none of those sources.

# ── Binary is the key ────────────────────────────────────────────

# rust-analyzer is the `rust-analyzer` rustup proxy on PATH (misc 162): it
# honors the project's rust-toolchain.toml rather than forcing stable, which
# is more correct. The proxy shim exists even when the component is absent, so
# doctor distinguishes proxy-present from component-installed
# (`server_binary_installed`).
[lsp.server.rust-analyzer]

[lsp.server.gopls]

[lsp.server.clangd]

[lsp.server.zls]

# pyright ships the `pyright-langserver` executable (the npm package is
# `pyright`, but the key is what Catenary spawns).
[lsp.server.pyright-langserver]
args = ["--stdio"]

[lsp.server.taplo]
args = ["lsp", "stdio"]

# tombi's LSP verb is `tombi lsp` — no `--stdio`, no `serve` (misc 207, the
# TOML succession candidate riding dual-bless-and-watch beside taplo).
[lsp.server.tombi]
args = ["lsp"]

[lsp.server.lattice]
args = ["serve"]

[lsp.server.marksman]
args = ["server"]

[lsp.server.intelephense]
args = ["--stdio"]

[lsp.server.vscode-css-language-server]
args = ["--stdio"]

[lsp.server.vscode-html-language-server]
args = ["--stdio"]

[lsp.server.vscode-json-language-server]
args = ["--stdio"]

[lsp.server.vscode-eslint-language-server]
args = ["--stdio"]

# jdtls (Eclipse JDT Language Server) is the Java default (tui-rework 10). The
# `jdtls` launcher manages its own workspace data dir, so no args. It requires a
# JDK >= 17 runtime — recorded on the CI provisioning stanza
# (defaults/ci-provision.toml), not here (servers.toml carries args only).
[lsp.server.jdtls]

# ruby-lsp serves Ruby over stdio by default (tui-rework 10).
[lsp.server.ruby-lsp]

# ── {name}-language-server and friends ───────────────────────────

[lsp.server.bash-language-server]
args = ["start"]

[lsp.server.haskell-language-server-wrapper]
args = ["--lsp"]

[lsp.server.typescript-language-server]
args = ["--stdio"]

[lsp.server.lua-language-server]

[lsp.server.yaml-language-server]
args = ["--stdio"]

[lsp.server.ansible-language-server]
args = ["--stdio"]

[lsp.server.cmake-language-server]

[lsp.server.docker-langserver]
args = ["--stdio"]

[lsp.server.csharp-ls]

[lsp.server.fsautocomplete]
args = ["--adaptive-lsp-server-enabled"]

[lsp.server.kotlin-language-server]

[lsp.server.ocamllsp]

[lsp.server.elm-language-server]
args = ["--stdio"]

[lsp.server.svelteserver]
args = ["--stdio"]

[lsp.server.nil]

[lsp.server.terraform-ls]
args = ["serve"]

[lsp.server.sourcekit-lsp]

[lsp.server.metals]

[lsp.server.dart]
args = ["language-server"]

# ── Runtime-embedded ─────────────────────────────────────────────

[lsp.server.julia]
args = ["--startup-file=no", "--history-file=no", "-e",
        "using LanguageServer; runserver()"]

[lsp.server.R]
args = ["--slave", "-e", "languageserver::run()"]
