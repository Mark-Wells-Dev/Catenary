# Built-in server definitions.
#
# Loaded as the lowest-priority config layer. User and project
# `[lsp.server.*]` entries completely replace the built-in default for
# that name — no merging.
#
# Names follow Decision 011 (server naming convention):
#   1. Server has its own name  → use as-is  (rust-analyzer, gopls)
#   2. Named {name}-language-server → shorten to {name}-ls  (bash-ls)
#   3. Runtime-embedded  → {lang}-ls  (julia-ls, r-ls)
#
# Mostly only `command` and `args` are defined here;
# `initialization_options`, `settings`, `env`, and other fields are user
# preferences.
#
# Diagnostic source weights (misc 115) are co-located on the source definition:
# as of linters ticket 05 a `[lsp.server.*]` may set `weight` (native-source
# trust), a `[lsp.server.*.sources]` sub-table (per-sub-source overrides, e.g.
# flycheck `rustc`/`clippy`), and `provisional` (the native source's provisional
# code band). The rust-analyzer / flycheck default (`rust-analyzer = 10`,
# `rustc`/`clippy = 100`, provisional `^E[0-9]+$`) ships in code
# (`DiagnosticWeights::rust_analyzer_default`), not here, so it survives a user
# redefining `[lsp.server.rust-analyzer]`, and is keyed on the LSP `source` field,
# so it is inert for any root whose diagnostics carry none of those sources.

# ── Own name ─────────────────────────────────────────────────────

[lsp.server.rust-analyzer]
command = "rustup"
args = ["run", "stable", "rust-analyzer"]

[lsp.server.gopls]
command = "gopls"

[lsp.server.clangd]
command = "clangd"

[lsp.server.zls]
command = "zls"

[lsp.server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[lsp.server.taplo]
command = "taplo"
args = ["lsp", "stdio"]

[lsp.server.lattice]
command = "lattice"
args = ["serve"]

[lsp.server.marksman]
command = "marksman"
args = ["server"]

[lsp.server.intelephense]
command = "intelephense"
args = ["--stdio"]

[lsp.server.vscode-css]
command = "vscode-css-language-server"
args = ["--stdio"]

[lsp.server.vscode-html]
command = "vscode-html-language-server"
args = ["--stdio"]

[lsp.server.vscode-json]
command = "vscode-json-language-server"
args = ["--stdio"]

[lsp.server.vscode-eslint]
command = "vscode-eslint-language-server"
args = ["--stdio"]

# jdtls (Eclipse JDT Language Server) is the Java default (tui-rework 10). The
# `jdtls` launcher manages its own workspace data dir, so no args. It requires a
# JDK >= 17 runtime — recorded on the CI provisioning stanza
# (defaults/ci-provision.toml), not here (servers.toml carries command/args only).
[lsp.server.jdtls]
command = "jdtls"

# ruby-lsp serves Ruby over stdio by default (tui-rework 10).
[lsp.server.ruby-lsp]
command = "ruby-lsp"

# ── {name}-ls ────────────────────────────────────────────────────

[lsp.server.bash-ls]
command = "bash-language-server"
args = ["start"]

[lsp.server.haskell-ls]
command = "haskell-language-server-wrapper"
args = ["--lsp"]

[lsp.server.typescript-ls]
command = "typescript-language-server"
args = ["--stdio"]

[lsp.server.lua-ls]
command = "lua-language-server"

[lsp.server.vim-ls]
command = "vim-language-server"
args = ["--stdio"]

[lsp.server.yaml-ls]
command = "yaml-language-server"
args = ["--stdio"]

[lsp.server.ansible-ls]
command = "ansible-language-server"
args = ["--stdio"]

[lsp.server.cmake-ls]
command = "cmake-language-server"

[lsp.server.sql-ls]
command = "sql-language-server"
args = ["up", "--method", "stdio"]

[lsp.server.docker-ls]
command = "docker-langserver"
args = ["--stdio"]

[lsp.server.csharp-ls]
command = "csharp-ls"

[lsp.server.fsautocomplete]
command = "fsautocomplete"
args = ["--adaptive-lsp-server-enabled"]

[lsp.server.kotlin-ls]
command = "kotlin-language-server"

[lsp.server.ocamllsp]
command = "ocamllsp"

[lsp.server.elm-ls]
command = "elm-language-server"
args = ["--stdio"]

[lsp.server.svelte-ls]
command = "svelteserver"
args = ["--stdio"]

[lsp.server.nil]
command = "nil"

[lsp.server.terraform-ls]
command = "terraform-ls"
args = ["serve"]

[lsp.server.sourcekit-lsp]
command = "sourcekit-lsp"

[lsp.server.metals]
command = "metals"

[lsp.server.dart-ls]
command = "dart"
args = ["language-server"]

# ── Runtime-embedded ─────────────────────────────────────────────

[lsp.server.julia-ls]
command = "julia"
args = ["--startup-file=no", "--history-file=no", "-e",
        "using LanguageServer; runserver()"]

[lsp.server.r-ls]
command = "R"
args = ["--slave", "-e", "languageserver::run()"]
