# macOS (Apple silicon) CI provisioning — the platform dimension of the
# conformance matrix (misc 164). NOT install recipes, NOT user-visible, NOT
# offerable — the same CI-internal boundary as defaults/ci-provision.toml.
#
# The Linux pins stay authoritative for Linux and live untouched in
# defaults/recipes.toml + defaults/ci-provision.toml; this file is the ONE
# per-server provisioning story for the macOS leg of
# .github/workflows/conformance.yml (`conform-macos`), which runs on
# `macos-latest` = arm64 ONLY (maintainer ruling 2026-07-09: Apple announced
# macOS 27 is Apple-silicon-exclusive, so there is no Intel leg to build).
#
# Server set (maintainer ruling 2026-07-10): the SAME server list blesses on
# both platforms — zero skips. The macOS leg stays brew-primary (Homebrew is the
# mac-specific source being exercised), but a server with NO homebrew-core
# formula is provisioned via its platform-neutral Linux kind, REFERENCED here so
# a Linux pin bump cannot silently diverge from the macOS leg. Every server the
# Linux matrix conforms appears here EXACTLY once — brew-provisioned,
# neutral-referenced, or (a legal-but-currently-unused arm) an explicit skip —
# so a server the macOS matrix does not prove is never silently absent. The
# partition is enforced twice from the same data: `tools/conformance_matrix.py
# --platform macos` (the discover job fails loudly) and the
# `macos_provisioning_partitions_the_conformed_set` guard in
# tests/conformance_harness.rs (fails `make check`).
#
# Fields:
#   kind      "homebrew" | "linux-recipe" | "linux-provision".
#             - homebrew        provisions via a homebrew-core `formula`.
#             - linux-recipe    reuses this server's Linux npm/pip/… recipe from
#                               defaults/recipes.toml (no formula in core). The
#                               generator resolves the reference and the
#                               conform-macos job installs the pinned version
#                               exactly like the Linux leg.
#             - linux-provision reuses this server's Linux stanza from
#                               defaults/ci-provision.toml (e.g. cargo-git-locked
#                               for the lattice dogfood). Same reuse contract.
#             The two neutral kinds REFERENCE the Linux source by this stanza's
#             server key (= its own name); they carry no pin of their own, so a
#             Linux pin bump flows through automatically.
#   formula   (homebrew) the homebrew-core formula name.
#   bin       (optional, homebrew) launcher path within the formula's keg, for a
#             keg-only formula that links nothing into $(brew --prefix)/bin
#             (llvm → bin/clangd). The workflow symlinks it onto PATH under the
#             server key, which IS the executable (misc 162).
#   skip      (legal, currently unused) true when a server has no viable
#             provisioning path at all; an explicit, honest annotation, not a
#             provision. The arm stays in the schema/guard for a future
#             genuinely-unprovisionable case.
#   note      the reason for a skip, or residual risk on a provision.
#
# PIN STRATEGY (recorded honestly): homebrew-core cannot install a historical
# formula version — `brew install <formula>` resolves homebrew-core HEAD, and
# `brew pin` only freezes a version already installed on a host. So, exactly
# like the Linux host-riding kinds (rustup-component, system-apt), a homebrew
# stanza carries NO version pin: brew's own bottle sha256 verification covers
# integrity, and the version that actually conformed is captured from the
# installed formula into the candidate blessed entry (platform =
# "macos-arm64"), which is the durable pin record. A neutral-reference stanza
# rides the referenced Linux pin, so its blessed entry records that exact
# version — no separate macOS pin exists to drift.
#
# Formula names below are CONFIRMED against homebrew-core from the first live
# macOS run (run 29067405830, 2026-07-09): a wrong name fails the macOS leg's
# `Validate formula` step loudly, never as a mysterious conformance red.

# ── Linux npm tranche → homebrew-core formulae ───────────────────────

[provision.bash-language-server]
kind = "homebrew"
formula = "bash-language-server"
note = "diagnostics come from shellcheck; the macOS job provisions it via brew too."

[provision.yaml-language-server]
kind = "homebrew"
formula = "yaml-language-server"

# typescript-language-server un-exempted (diagnostics-debt 05). Provisioned via
# its Linux npm recipe, reused unchanged — the npm package is cross-platform and
# the homebrew-core formula name is unconfirmed against the macOS leg, so the
# recipe reference is the honest, verification-safe choice (matches the
# intelephense/svelteserver/elm rulings).
[provision.typescript-language-server]
kind = "linux-recipe"
note = "no confirmed homebrew-core formula; reuses the Linux npm recipe (defaults/recipes.toml)."

# One vscode-langservers-extracted formula carries all three conformed
# servers, mirroring the one-npm-package/three-recipes shape on Linux.
[provision.vscode-json-language-server]
kind = "homebrew"
formula = "vscode-langservers-extracted"

[provision.vscode-css-language-server]
kind = "homebrew"
formula = "vscode-langservers-extracted"

[provision.vscode-html-language-server]
kind = "homebrew"
formula = "vscode-langservers-extracted"

# The pyright formula links the `pyright-langserver` launcher alongside
# `pyright` (the npm package ships both binaries).
[provision.pyright-langserver]
kind = "homebrew"
formula = "pyright"

# No homebrew-core formula: intelephense is a proprietary-licensed npm package,
# which homebrew-core does not carry. Provisioned via its Linux npm recipe,
# reused unchanged (maintainer ruling 2026-07-10).
[provision.intelephense]
kind = "linux-recipe"
note = "no homebrew-core formula; reuses the Linux npm recipe (defaults/recipes.toml)."

# No homebrew-core formula for svelte-language-server. Provisioned via its Linux
# npm recipe, reused unchanged (maintainer ruling 2026-07-10).
[provision.svelteserver]
kind = "linux-recipe"
note = "no homebrew-core formula; reuses the Linux npm recipe (defaults/recipes.toml)."

# CONFIRMED ABSENT (run 29067405830): elm-language-server has no homebrew-core
# formula. Provisioned via its Linux npm recipe, reused unchanged (maintainer
# ruling 2026-07-10). The elm compiler it shells out to is provisioned via the
# brew `elm` formula by the workflow's diagnostic-dependencies step (the Linux
# leg's pinned GitHub release binary ships no arm64 macOS asset). Cold-ELM_HOME
# bootstrap inherits the same no-pre-warm ruling as Linux (misc 156).
[provision.elm-language-server]
kind = "linux-recipe"
note = "no homebrew-core formula; reuses the Linux npm recipe. The elm compiler is provisioned via the brew `elm` formula (no arm64 GitHub-release asset)."

[provision.docker-langserver]
kind = "homebrew"
formula = "dockerfile-language-server"

# No homebrew-core formula for @ansible/ansible-language-server (ansible and
# ansible-lint are in core; the language server is not). Provisioned via its
# Linux npm recipe, reused unchanged (maintainer ruling 2026-07-10). ansible-lint
# is provisioned via brew by the workflow's diagnostic-dependencies step.
[provision.ansible-language-server]
kind = "linux-recipe"
note = "no homebrew-core formula; reuses the Linux npm recipe. Diagnostics need ansible-lint, provisioned via brew."

# tombi's stanza rides the misc-207 BLESS BRANCH with its Case (its recipe
# ships `conformance = false` in the interim, so the partition guard correctly
# rejects a stanza here for a server the Linux matrix does not conform). The
# bless-branch shape, decided: no CONFIRMED homebrew-core formula (a `tombi`
# formula exists upstream-side but is unconfirmed against the `Validate
# formula` step), so `[provision.tombi] kind = "linux-recipe"` — the npm
# package's platform optionalDependencies ship a darwin-arm64 binary, matching
# the typescript-language-server/intelephense/svelteserver/elm rulings.

# ── Linux cargo / go tranches → homebrew-core formulae ───────────────

[provision.taplo]
kind = "homebrew"
formula = "taplo"

[provision.gopls]
kind = "homebrew"
formula = "gopls"
note = "gopls shells out to the host `go` toolchain at analysis time; the macos-latest image ships one."

# ── Linux ci-provision.toml twins ────────────────────────────────────

[provision.rust-analyzer]
kind = "homebrew"
formula = "rust-analyzer"
note = "brew's standalone binary, not the rustup component — no proxy-shim indirection on this leg (the misc 162 PATH dance is Linux-matrix-only)."

[provision.clangd]
kind = "homebrew"
formula = "llvm"
bin = "bin/clangd"
note = "llvm is keg-only (macOS ships its own toolchain), so nothing lands on PATH by default; `bin` names the launcher and the workflow symlinks it in as `clangd`. The llvm bottle is heavy but is the leanest core formula that carries clangd."

# The Linux leg is a `binary` recipe now (lsm 04, defaults/recipes.toml); its
# macos-arm64 artifact is pending attended resolution, so this leg stays on the
# homebrew-core formula meanwhile.
[provision.lua-language-server]
kind = "homebrew"
formula = "lua-language-server"

# No homebrew formula (the maintainer's own repo, not in homebrew-core).
# Provisioned via its Linux cargo-git-locked stanza, reused unchanged: the kind
# is platform-neutral and pins an exact rev with --locked (maintainer ruling
# 2026-07-10). The conform-macos job's lattice entry gains a rustup/toolchain
# step for the source build.
[provision.lattice]
kind = "linux-provision"
note = "no homebrew formula; reuses the Linux cargo-git-locked provision (defaults/ci-provision.toml), which is platform-neutral."

[provision.ruby-lsp]
kind = "homebrew"
formula = "ruby-lsp"
note = "the formula carries its own ruby dependency, so the Linux leg's GEM_HOME/GEM_PATH provisioning (user-gem dirs vs isolate_env's XDG re-pointing) is expected not to apply; first-run triage confirms."
