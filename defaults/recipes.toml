# CI-INTERNAL install recipe DRAFTS — NOT user-visible, NOT blessable.
#
# Each `[recipe.<server>]` keys a canonical server name from
# `defaults/servers.toml`. A recipe records how a conformance CI matrix job
# installs that server, pinned, before running the harness against it:
#   ecosystem  npm | cargo | pip | go
#   package    the package/module id within the ecosystem
#   version    an EXACT pin (never a range)
#   tier       how the artifact is verified (see below)
#   draft      always true — a draft is CI-internal and never reaches a user
#              surface; only the blessed-manifest (defaults/blessed-manifest.toml)
#              feeds any recommendation, and a draft never enters it.
#   hash       (optional) the pinned content hash for hash-carrying tiers
#   note       (optional) residual supply-chain risk, stated honestly
#   co_install (optional) pinned npm package(s) the server needs resolvable at
#              runtime but does not bundle, co-installed alongside it (misc 195):
#              [[recipe.<server>.co_install]] with package + version + hash, each
#              pinned + verified by the SAME npm-tarball-sha512 mechanics. An
#              array-of-tables, so it trails the scalars (and precedes runtime).
#              ts-ls carries one (typescript → tsserver); no other draft needs
#              one yet.
#   runtime    (optional) an extra runtime dep, e.g.
#              runtime = { name = "jdk", version = ">=17" } — declared LAST in a
#              stanza (it is a sub-table). No tranche-1/2 draft needs one yet.
#
# Verification tiers (tui-rework 06 §"Recipes as data"):
#   go-checksumdb        version pin; the Go checksum DB verifies transparently
#                        (no explicit hash carried).
#   cargo-locked         exact version installed with `--locked`; cargo verifies
#                        the registry index checksums (no explicit hash carried).
#   pip-hashes           installed with `--require-hashes`; the sha256 set is
#                        pinned in `hash` + generated over the full dep closure.
#   npm-tarball-sha512   exact version + the expected tarball sha512 (`hash`, in
#                        SRI form); the engine fetches, verifies, then installs
#                        with `--ignore-scripts`.
#
# HASHES: npm `hash` values are the registry `dist.integrity` (SRI sha512) for
# the pinned version, obtained mechanically from the npm registry metadata
# (`registry.npmjs.org/<pkg>/<version>`) — never hand-computed or invented.
# `make refresh-recipes` re-resolves versions and re-fetches these on every bump,
# and the conformance install VERIFIES the pin against `hash`, so a mis-pasted
# value fails the matrix loudly rather than shipping. Versions resolved
# 2026-07-07. Where a hash-carrying tier has no `hash` it is marked pending: the
# pip closure needs `pip-compile --generate-hashes` over the whole dep tree,
# which refresh-recipes runs — a single-artifact hash would not satisfy
# `--require-hashes` and so is honestly omitted rather than half-filled.

# ── npm tranche ──────────────────────────────────────────────────────
# node is the implied host runtime for every npm recipe (no `runtime` field).

[recipe.bash-language-server]
ecosystem = "npm"
package = "bash-language-server"
version = "5.6.0"
tier = "npm-tarball-sha512"
draft = true
hash = "sha512-DCuV+/BZAAozsp5blvi6jDnU/ZDaTpJpWM0zqwGjnirfqv7iBsMK32xOze/jipxU0PUZ6CBUKgRUMKI7Kk70Lg=="
note = "diagnostics come from shellcheck; a conformance job provisions it too."

