# TOML rides two bindings during the misc-207 dual-bless-and-watch. Binding
# order is dispatch priority and bindings FAN OUT for diagnostics (every bound,
# blessed, spawned server feeds), so taplo listed FIRST keeps taplo primary;
# the tombi-primary flip is the later watch graduation, on conformance
# evidence. Until the human bless lands `[blessed.tombi.*]` rows, tombi
# classifies enrichment-only (queries only, diagnostics withheld) and taplo
# remains the sole TOML diagnostics source.
[lsp.language.toml]
extensions = ["toml"]
filenames = ["Cargo.toml", "Cargo.lock"]
servers = ["taplo", "tombi"]

