# Default language classification, root marker rules, and server bindings.
#
# Loaded as the lowest-priority config layer. User and project configs
# override individual fields via field-level merge. Server bindings
# reference canonical names from `defaults/servers.toml` — languages
# without a `servers` entry work for classification but have no LSP
# intelligence until the user adds a server binding.
#
# Classification precedence: shebang > filename > extension.
#
# Root markers define project boundaries within workspace roots.
# When a file is opened, Catenary walks up from the file toward the
# workspace root, stopping at the first directory containing any marker.
# That directory becomes the server instance's root. Override with
# `root_markers = [...]` or disable with `root_markers = []`.

# ── Systems ─────────────────────────────────────────────────────────

[lsp.language.rust]
extensions = ["rs"]
servers = ["rust-analyzer"]
root_markers = ["Cargo.toml"]

[lsp.language.go]
extensions = ["go"]
servers = ["gopls"]
root_markers = ["go.mod"]

[lsp.language.c]
extensions = ["c"]
servers = ["clangd"]
root_markers = ["compile_commands.json", ".clangd"]

[lsp.language.cpp]
extensions = ["cpp", "cc", "cxx", "h", "hpp"]
servers = ["clangd"]
root_markers = ["compile_commands.json", ".clangd"]

[lsp.language.zig]
