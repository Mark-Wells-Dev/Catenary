# Default language classification and root marker rules.
#
# Loaded as the lowest-priority config layer. User and project configs
# override individual fields via field-level merge. No server bindings
# are defined here — those come from user configuration.
#
# Classification precedence: shebang > filename > extension.
#
# Root markers define project boundaries within workspace roots.
# When a file is opened, Catenary walks up from the file toward the
# workspace root, stopping at the first directory containing any marker.
# That directory becomes the server instance's root. Override with
# `root_markers = [...]` or disable with `root_markers = []`.

# ── Systems ─────────────────────────────────────────────────────────

[language.rust]
extensions = ["rs"]
root_markers = ["Cargo.toml"]

[language.go]
extensions = ["go"]
root_markers = ["go.mod"]

[language.c]
extensions = ["c"]
root_markers = ["compile_commands.json", ".clangd"]

[language.cpp]
extensions = ["cpp", "cc", "cxx", "h", "hpp"]
root_markers = ["compile_commands.json", ".clangd"]

[language.zig]
extensions = ["zig"]
root_markers = ["build.zig"]

[language.d]
extensions = ["d"]
root_markers = ["dub.json", "dub.sdl"]

[language.v]
extensions = ["v"]

[language.nim]
extensions = ["nim"]

# ── JVM ─────────────────────────────────────────────────────────────

[language.java]
extensions = ["java"]
root_markers = ["pom.xml", "build.gradle", "build.gradle.kts"]

[language.kotlin]
extensions = ["kt", "kts"]
shebangs = ["kotlin"]
root_markers = ["build.gradle", "build.gradle.kts"]

[language.scala]
extensions = ["scala", "sc"]
shebangs = ["scala"]
root_markers = ["build.sbt", "build.sc"]

[language.groovy]
extensions = ["groovy", "gvy"]
shebangs = ["groovy"]

[language.clojure]
extensions = ["clj", "cljs", "cljc"]

# ── .NET ────────────────────────────────────────────────────────────

[language.csharp]
extensions = ["cs"]
root_markers = ["*.sln", "*.csproj"]

[language.fsharp]
extensions = ["fs", "fsx", "fsi"]
root_markers = ["*.sln", "*.fsproj"]

# ── Apple ───────────────────────────────────────────────────────────

[language.swift]
