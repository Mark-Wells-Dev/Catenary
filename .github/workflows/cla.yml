name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The action reads its configuration from `with:` inputs, not env vars
        # (PR #33: the config lived under `env:`, the action ignored it and ran
        # on its defaults — signatures on the nonexistent `master` branch at the
        # `./`-prefixed path the contents API rejects as a malformed path
        # component). Only the token belongs in `env:`.
        with:
          # The URL to the CLA document
          path-to-document: 'https://github.com/TwoWells/Catenary/blob/main/.github/CLA.md'
          # The path to the file where signatures will be stored (relative
          # to repository root). We store it in .github to keep the root clean
          path-to-signatures: '.github/cla-signatures.json'
          # The branch where signatures are committed
          branch: 'main'
          # Message that appears in the PR comment
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          # List of users to ignore: bots, plus the repository owner — a CLA
          # licenses inbound third-party contributions to the owner; the owner
          # signing their own CLA is vacuous (ruled 2026-07-21, PR #33).
          allowlist: 'dependabot[bot],renovate[bot],m-wells'
