---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch/PR cancels the prior in-flight run.
# Releases live in cd.yml (tag-triggered), so this never cancels a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - run: cargo fmt --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # macOS lints the target_os = "macos" branches (e.g. notify.rs
      # osascript) that never compile on the Linux runner.
      - run: cargo clippy --all-targets --features mockls -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --bins --tests --features mockls
      # Full suite: unit + tests/ integration (mockls-driven, no real
      # servers). The few real-server cases are #[ignore]'d and skip by
      # default; they run locally via `make test-ignored` and in the
      # conformance harness.
      - run: cargo test --no-fail-fast --features mockls

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
