---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch/PR cancels the prior in-flight run.
# Releases live in cd.yml (tag-triggered), so this never cancels a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - run: cargo fmt --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # macOS lints the target_os = "macos" branches (e.g. notify.rs
      # osascript) that never compile on the Linux runner.
      # `make clippy` is the lint gate's single source of truth (misc 202): the
      # pedantic/nursery/cargo groups live in Cargo.toml's
      # `[workspace.lints.clippy]`, so this carries no group flags — only
      # `-D warnings`, the deny lever.
      - run: make clippy

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo build --bins --tests --features mockls
      # Full suite: unit + tests/ integration (mockls-driven, no real
      # servers). The few real-server cases are #[ignore]'d and skip by
      # default; they run locally via `make test-ignored` and in the
      # conformance harness.
      #
      # nextest, matching `make check`'s harness: process-per-test. Raw
      # `cargo test` runs all lib tests as THREADS of one process, where
      # process-global test instrumentation (e.g. the bug-78 guard's
      # SCAN_BYTES counter) is contaminated by concurrent tests — the
      # run-29042647606 ubuntu false failure. nextest makes that
      # impossible and is the harness every local bar already uses.
      - run: cargo nextest run --workspace --features mockls --no-fail-fast

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  # ws41-03: the per-PR bridge-crate version-bump guard. Any PR whose diff
  # touches the catenary-mcp bridge crate (docs INCLUDED) must bump that crate's
  # `version` — the daemon<->bridge handshake comparand — in the same PR. There
  # is NO escape hatch (maintainer-ruled): a false positive costs one harmless
  # /mcp, a false negative is a silent wire divergence. PR-only: the guard's job
  # is PR-time (a direct push to main is the maintainer's solo path and has no
  # base to diff). fetch-depth: 0 so the PR base sha resolves for the diff.
  bridge-bump-guard:
    name: Bridge bump guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # base ref needed to diff the bridge crate
      - name: Guard the bridge crate version
        run: make bump-guard BASE="${{ github.event.pull_request.base.sha }}"
