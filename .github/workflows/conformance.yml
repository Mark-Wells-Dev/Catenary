name: Conformance

# Language-server conformance harness (tui-rework 07): install each pinned,
# hash-verified server on the runner, then drive the REAL Catenary lifecycle
# against its fixture (initialize with the shipped default config → edit →
# diagnostics batch with settle → collect → shutdown), asserting settle reaches
# idle inside a finite wall bound, the intentional diagnostic publishes, and
# shutdown is clean.
#
# Cadence rides the pins (a pinned, hash-verified artifact cannot drift, so a
# schedule proves nothing): the matrix runs when a recipe/defaults/fixture/harness
# file changes. It is diff-scoped on ordinary recipe edits and full on
# refresh-recipes PRs (where every pin can move) or any structural change.
#
# Blessing = the green matrix job + the human review of the PR. This workflow
# EMITS a candidate blessed-manifest as a build artifact (server → conformed
# version / platform / date); nothing is pushed — the maintainer blesses by
# committing the conformed entries in the reviewed PR.

on:
  pull_request:
    branches: [main]
    paths:
      - "defaults/recipes.toml"
      - "defaults/ci-provision.toml"
      - "defaults/servers.toml"
      - "defaults/languages.toml"
      - "tests/fixtures/conformance/**"
      - "tests/conformance_harness.rs"
      - "tests/common/mod.rs"
      - "tools/refresh_recipes.py"
      - "tools/conformance_matrix.py"
      - ".github/workflows/conformance.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  discover:
    name: Discover matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      empty: ${{ steps.gen.outputs.empty }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # base ref needed for diff-scoping

      - name: Generate matrix
        id: gen
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          scope_full=1
          # workflow_dispatch (no PR base) and structural changes run the full
          # matrix; an ordinary recipe/provision edit is diff-scoped to the
          # changed stanzas of whichever pin file(s) moved.
          if [ -n "$base" ]; then
            changed="$(git diff --name-only "$base" "${{ github.sha }}")"
            echo "changed files:"; echo "$changed"
            # Only the two pin files are diff-scopeable; any other changed file
            # (a fixture, the harness, servers/languages) may affect any server.
            if echo "$changed" | grep -qvE '^defaults/(recipes|ci-provision)\.toml$'; then
              scope_full=1
            else
              scope_full=0
            fi
          fi
          if [ "$scope_full" -eq 0 ]; then
            # Diff-scope BOTH sources against their base. A file that did not
            # change compares equal to its base → zero jobs from it, so a
            # recipes-only edit still scopes to changed recipes (and vice versa).
            git show "$base:defaults/recipes.toml" > /tmp/base-recipes.toml
            git show "$base:defaults/ci-provision.toml" > /tmp/base-provision.toml
            matrix="$(python3 tools/conformance_matrix.py \
              --base-recipes /tmp/base-recipes.toml \
              --base-provision /tmp/base-provision.toml)"
          else
            matrix="$(python3 tools/conformance_matrix.py)"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          count="$(printf '%s' "$matrix" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')"
          if [ "$count" -eq 0 ]; then echo "empty=true" >> "$GITHUB_OUTPUT"; else echo "empty=false" >> "$GITHUB_OUTPUT"; fi

  conform:
    name: "Conform ${{ matrix.server }}"
    needs: discover
    if: needs.discover.outputs.empty != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      # One shared compile cache across the whole matrix (ci.yml precedent) —
      # 24 jobs otherwise each cold-build the harness.
      - uses: Swatinem/rust-cache@v2

      - name: Provision runtime dependency (${{ matrix.runtime_name }})
        if: matrix.runtime_name == 'jdk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.runtime_version || '21' }}

      # Some servers derive diagnostics from an external linter named in the
      # recipe `note` (bash-ls → shellcheck, ansible-ls → ansible-lint, elm-ls →
      # the elm compiler). Provisioned here so the intentional diagnostic can
      # publish. (These should graduate to structured `runtime` fields.)
      - name: Provision diagnostic dependencies
        run: |
          set -euo pipefail
          case "${{ matrix.server }}" in
            bash-ls) sudo apt-get update && sudo apt-get install -y shellcheck ;;
            ansible-ls) pipx install ansible-lint || pip install ansible-lint ;;
            elm-ls) npm install -g --ignore-scripts elm ;;
            *) echo "no extra diagnostic dependency for ${{ matrix.server }}" ;;
          esac

      - name: Install pinned server (${{ matrix.ecosystem }} ${{ matrix.package }}@${{ matrix.version }})
        if: matrix.source == 'recipe'
        run: |
          set -euo pipefail
          case "${{ matrix.ecosystem }}" in
            npm)
              # npm-tarball-sha512: fetch the exact tarball, verify OUR pinned
              # sha512, then install the verified artifact with --ignore-scripts
              # (install scripts never run).
              tarball="$(npm view "${{ matrix.package }}@${{ matrix.version }}" dist.tarball)"
              curl -sSL "$tarball" -o pkg.tgz
              actual="sha512-$(openssl dgst -sha512 -binary pkg.tgz | openssl base64 -A)"
              if [ -n "${{ matrix.hash }}" ] && [ "$actual" != "${{ matrix.hash }}" ]; then
                echo "integrity mismatch for ${{ matrix.package }}@${{ matrix.version }}"
                echo "  expected ${{ matrix.hash }}"
                echo "  actual   $actual"
                exit 1
              fi
              npm install -g --ignore-scripts ./pkg.tgz
              ;;
            cargo)
              cargo install "${{ matrix.package }}" --version "${{ matrix.version }}" --locked
              ;;
            pip)
              if [ -n "${{ matrix.hash }}" ]; then
                printf '%s==%s --hash=sha256:%s\n' "${{ matrix.package }}" "${{ matrix.version }}" "${{ matrix.hash }}" > req.txt
                pip install --require-hashes -r req.txt
              else
                pip install "${{ matrix.package }}==${{ matrix.version }}"
              fi
              ;;
            go)
              go install "${{ matrix.package }}@${{ matrix.version }}"
              echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
              ;;
            *)
              echo "unknown ecosystem: ${{ matrix.ecosystem }}"; exit 1 ;;
          esac

      # CI-only provisioning (tui-rework 10): obtain a server that no user-grade
      # ecosystem recipe can carry. One branch per provisioning `kind`. Pending
      # stanzas never reach here — conformance_matrix.py drops them (an
      # unresolved pin can't be installed).
      - name: Provision server (${{ matrix.kind }} ${{ matrix.server }})
        if: matrix.source == 'provision'
        run: |
          set -euo pipefail
          case "${{ matrix.kind }}" in
            rustup-component)
              # Rides the pinned toolchain; the component adds the binary.
              rustup component add "${{ matrix.component }}"
              ;;
            system-apt)
              sudo apt-get update && sudo apt-get install -y "${{ matrix.apt }}"
              ;;
            github-release-sha256)
              # Fetch the pinned asset, verify OUR pinned sha256, then place its
              # launcher on PATH under the shipped server command (= basename bin).
              url="https://github.com/${{ matrix.repo }}/releases/download/${{ matrix.version }}/${{ matrix.asset }}"
              curl -sSL "$url" -o asset.dl
              actual="$(sha256sum asset.dl | cut -d' ' -f1)"
              if [ "$actual" != "${{ matrix.sha256 }}" ]; then
                echo "sha256 mismatch for ${{ matrix.asset }}"
                echo "  expected ${{ matrix.sha256 }}"
                echo "  actual   $actual"
                exit 1
              fi
              dest="$HOME/.provision/${{ matrix.server }}"
              mkdir -p "$dest"
              case "${{ matrix.asset }}" in
                *.tar.gz|*.tgz) tar -xzf asset.dl -C "$dest" ;;
                *.zip)          unzip -q asset.dl -d "$dest" ;;
                *)              cp asset.dl "$dest/${{ matrix.bin }}" ;;  # bare binary
              esac
              chmod +x "$dest/${{ matrix.bin }}"
              bindir="$HOME/.local/bin"; mkdir -p "$bindir"
              ln -sf "$dest/${{ matrix.bin }}" "$bindir/$(basename "${{ matrix.bin }}")"
              echo "$bindir" >> "$GITHUB_PATH"
              ;;
            cargo-git-locked)
              # Reproducible source build pinned to an exact commit.
              cargo install --git "${{ matrix.git }}" --rev "${{ matrix.rev }}" --locked "${{ matrix.server }}"
              ;;
            tarball-sha256)
              url="${{ matrix.url }}"
              curl -sSL "$url" -o asset.dl
              actual="$(sha256sum asset.dl | cut -d' ' -f1)"
              if [ "$actual" != "${{ matrix.sha256 }}" ]; then
                echo "sha256 mismatch for $url"; exit 1
              fi
              dest="$HOME/.provision/${{ matrix.server }}"
              mkdir -p "$dest"
              tar -xzf asset.dl -C "$dest"
              bindir="$HOME/.local/bin"; mkdir -p "$bindir"
              ln -sf "$dest/${{ matrix.bin }}" "$bindir/$(basename "${{ matrix.bin }}")"
              echo "$bindir" >> "$GITHUB_PATH"
              ;;
            gem)
              # RubyGems carries no npm-grade integrity — the exact-version pin
              # plus RubyGems' index is the verification (recorded honestly).
              gem install "${{ matrix.gem }}" --version "${{ matrix.version }}"
              ;;
            *)
              echo "unknown provisioning kind: ${{ matrix.kind }}"; exit 1 ;;
          esac

      - name: Run conformance harness (${{ matrix.server }})
        env:
          CATENARY_CONFORMANCE: ${{ matrix.server }}
        # Plain cargo, matching ci.yml — the runner has no nextest and this
        # repo installs no third-party runner tooling for it (first live
        # dispatch failed all 24 jobs on `no such command: nextest`).
        run: |
          cargo test --test conformance_harness --features mockls --no-fail-fast

      - name: Emit blessed entry
        run: |
          set -euo pipefail
          mkdir -p blessed
          # Host-riding provisions (rustup component, apt) carry no pin version;
          # capture the actually-conformed version from the binary so the
          # candidate manifest is honest.
          ver="${{ matrix.version }}"
          if [ -z "$ver" ]; then
            case "${{ matrix.server }}" in
              rust-analyzer) ver="$(rustup run stable rust-analyzer --version 2>/dev/null | head -1 || true)" ;;
              clangd)        ver="$(clangd --version 2>/dev/null | head -1 || true)" ;;
              *)             ver="unknown" ;;
            esac
          fi
          cat > "blessed/${{ matrix.server }}.toml" <<EOF
          [blessed.${{ matrix.server }}]
          version = "$ver"
          platform = "linux-x86_64"
          date = "$(date -u +%Y-%m-%d)"
          tier = "verified-on-linux"
          EOF
          cat "blessed/${{ matrix.server }}.toml"

      - name: Upload blessed entry
        uses: actions/upload-artifact@v4
        with:
          name: blessed-${{ matrix.server }}
          path: blessed/${{ matrix.server }}.toml
          retention-days: 7

  bless:
    name: Assemble blessed-manifest
    needs: conform
    if: ${{ always() && needs.conform.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download conformed entries
        uses: actions/download-artifact@v4
        with:
          pattern: blessed-*
          path: entries
          merge-multiple: true

      - name: Assemble candidate manifest
        run: |
          set -euo pipefail
          # Start from the committed manifest's header comment, then append every
          # entry that conformed green this run. This is a CANDIDATE artifact for
          # review — nothing is pushed; the maintainer blesses by committing the
          # conformed entries into defaults/blessed-manifest.toml in the PR.
          sed -n '/^#/p' defaults/blessed-manifest.toml > candidate-blessed-manifest.toml
          echo >> candidate-blessed-manifest.toml
          for f in $(find entries -name '*.toml' | sort); do
            cat "$f" >> candidate-blessed-manifest.toml
            echo >> candidate-blessed-manifest.toml
          done
          {
            echo '## Candidate blessed-manifest (this run)';
            echo '';
            echo 'Copy the conformed entries below into `defaults/blessed-manifest.toml`';
            echo 'to bless them — nothing is pushed automatically.';
            echo '';
            echo '```toml';
            cat candidate-blessed-manifest.toml;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate manifest
        uses: actions/upload-artifact@v4
        with:
          name: candidate-blessed-manifest
          path: candidate-blessed-manifest.toml
          retention-days: 30
