---
name: Conformance

# Language-server conformance harness (tui-rework 07): install each pinned,
# hash-verified server on the runner, then drive the REAL Catenary lifecycle
# against its fixture (initialize with the shipped default config → edit →
# diagnostics batch with settle → collect → shutdown), asserting settle reaches
# idle inside a finite wall bound, the intentional diagnostic publishes, and
# shutdown is clean.
#
# Cadence rides the pins (a pinned, hash-verified artifact cannot drift, so a
# schedule proves nothing): the matrix runs when a recipe / defaults / fixture
# / harness file changes. It is diff-scoped on ordinary recipe edits and full
# on refresh-recipes PRs (where every pin can move) or any structural change.
#
# Blessing = the green matrix job + the human review of the PR. This workflow
# EMITS a candidate blessed-manifest as a build artifact (server → conformed
# version / platform / date); nothing is pushed — the maintainer blesses by
# committing the conformed entries in the reviewed PR.
#
# Platform dimension (misc 164): the matrix runs per-platform, and the SAME
# server list blesses on both. Linux jobs ride the recipes + ci-provision pins;
# the macOS leg (macos-latest = Apple silicon only, maintainer ruling — macOS 27
# is arm-exclusive) rides defaults/ci-provision-macos.toml. That leg is
# brew-primary, but a server with no homebrew-core formula rides its
# platform-neutral Linux kind, REFERENCED not re-pinned (a `linux-recipe` reuses
# the Linux npm recipe; `linux-provision` reuses the Linux cargo-git-locked
# provision), so a Linux pin bump cannot silently diverge — zero skips. Each
# platform builds its own harness: cargo bakes absolute paths at compile time
# and the checkout roots differ (/home/runner vs /Users/runner), so the Linux
# artifact cannot serve a macOS job. Blessed rows are platform-qualified
# (`[blessed.<server>.<platform>]`), so both platforms' candidate rows merge
# into the ONE committed defaults/blessed-manifest.toml.

"on":
  pull_request:
    branches: [main]
    paths:
      - "defaults/recipes.toml"
      - "defaults/ci-provision.toml"
      - "defaults/ci-provision-macos.toml"
      - "defaults/servers.toml"
      - "defaults/languages.toml"
      - "tests/fixtures/conformance/**"
      - "tests/conformance_harness.rs"
      - "tests/common/mod.rs"
      - "tools/refresh_recipes.py"
      - "tools/conformance_matrix.py"
      - ".github/workflows/conformance.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  discover:
    name: Discover matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      empty: ${{ steps.gen.outputs.empty }}
      matrix_macos: ${{ steps.gen.outputs.matrix_macos }}
      empty_macos: ${{ steps.gen.outputs.empty_macos }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # base ref needed for diff-scoping

      - name: Generate matrix
        id: gen
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          scope_full=1
          # workflow_dispatch (no PR base) and structural changes run the full
          # matrix; an ordinary recipe/provision edit is diff-scoped to the
          # changed stanzas of whichever pin file(s) moved.
          if [ -n "$base" ]; then
            changed="$(git diff --name-only "$base" "${{ github.sha }}")"
            echo "changed files:"; echo "$changed"
            # Only the three pin files are diff-scopeable; any other changed
            # file (a fixture, the harness, servers/languages) may affect any
            # server.
            pins='^defaults/(recipes|ci-provision|ci-provision-macos)\.toml$'
            if echo "$changed" | grep -qvE "$pins"; then
              scope_full=1
            else
              scope_full=0
            fi
          fi
          if [ "$scope_full" -eq 0 ]; then
            # Diff-scope EVERY source against its base. A file that did not
            # change compares equal to its base → zero jobs from it, so a
            # recipes-only edit still scopes to changed recipes (and vice
            # versa). A base that predates ci-provision-macos.toml gets an
            # empty base file, so every macOS stanza reads as changed.
            git show "$base:defaults/recipes.toml" > /tmp/base-recipes.toml
            git show "$base:defaults/ci-provision.toml" > /tmp/base-prov.toml
            git show "$base:defaults/ci-provision-macos.toml" \
              > /tmp/base-prov-macos.toml || : > /tmp/base-prov-macos.toml
            matrix="$(python3 tools/conformance_matrix.py \
              --base-recipes /tmp/base-recipes.toml \
              --base-provision /tmp/base-prov.toml)"
            matrix_macos="$(python3 tools/conformance_matrix.py \
              --platform macos \
              --base-macos-provision /tmp/base-prov-macos.toml)"
          else
            matrix="$(python3 tools/conformance_matrix.py)"
            matrix_macos="$(python3 tools/conformance_matrix.py \
              --platform macos)"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "matrix_macos=$matrix_macos" >> "$GITHUB_OUTPUT"
          njobs='import json,sys; print(len(json.load(sys.stdin)["include"]))'
          count="$(printf '%s' "$matrix" | python3 -c "$njobs")"
          if [ "$count" -eq 0 ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi
          count_macos="$(printf '%s' "$matrix_macos" | python3 -c "$njobs")"
          if [ "$count_macos" -eq 0 ]; then
            echo "empty_macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty_macos=false" >> "$GITHUB_OUTPUT"
          fi

  # Build the harness + catenary binaries ONCE; every matrix job downloads
  # and executes them instead of recompiling (~1 min × 24 jobs saved). Safe
  # because cargo bakes CARGO_BIN_EXE_*/CARGO_MANIFEST_DIR as absolute
  # paths at compile time and every ubuntu runner checks out to the same
  # /home/runner/work/<repo>/<repo> — the matrix restores the binaries at
  # those exact paths.
  build:
    name: Build harness once
    needs: discover
    if: needs.discover.outputs.empty != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Compile harness and binaries
        run: |
          set -euo pipefail
          cargo test --test conformance_harness --features mockls \
            --no-run --message-format=json > cargo-build.jsonl
          exe="$(jq -r 'select(.reason=="compiler-artifact")
            | select(.target.name=="conformance_harness")
            | .executable // empty' cargo-build.jsonl | tail -n1)"
          test -n "$exe"
          mkdir -p dist/target/debug
          cp "$exe" dist/conformance_harness
          cp target/debug/catenary dist/target/debug/catenary
          if [ -f target/debug/mockls ]; then
            cp target/debug/mockls dist/target/debug/mockls
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: conformance-dist
          path: dist
          retention-days: 1

  # macOS twin of the build-once job (misc 164). It cannot reuse the Linux
  # artifact: a macOS runner checks out to /Users/runner/work/<repo>/<repo>
  # (not /home/runner/...) and needs Mach-O binaries, so the harness compiles
  # once per platform, at that platform's baked paths.
  build-macos:
    name: Build harness once (macOS)
    needs: discover
    if: needs.discover.outputs.empty_macos != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Compile harness and binaries
        run: |
          set -euo pipefail
          cargo test --test conformance_harness --features mockls \
            --no-run --message-format=json > cargo-build.jsonl
          exe="$(jq -r 'select(.reason=="compiler-artifact")
            | select(.target.name=="conformance_harness")
            | .executable // empty' cargo-build.jsonl | tail -n1)"
          test -n "$exe"
          mkdir -p dist/target/debug
          cp "$exe" dist/conformance_harness
          cp target/debug/catenary dist/target/debug/catenary
          if [ -f target/debug/mockls ]; then
            cp target/debug/mockls dist/target/debug/mockls
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: conformance-dist-macos
          path: dist
          retention-days: 1

  conform:
    name: "Conform ${{ matrix.server }}"
    needs: [discover, build]
    if: needs.discover.outputs.empty != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      # rustup stays for the provisions that need a toolchain
      # (rustup-component, cargo-git-locked); no compile happens here.
      - run: rustup show

      - name: Fetch prebuilt harness
        uses: actions/download-artifact@v8
        with:
          name: conformance-dist
          path: dist

      - name: Install prebuilt binaries at their baked paths
        run: |
          set -euo pipefail
          mkdir -p target/debug
          cp dist/target/debug/* target/debug/
          chmod +x target/debug/* dist/conformance_harness

      - name: Provision runtime dependency (${{ matrix.runtime_name }})
        if: matrix.runtime_name == 'jdk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.runtime_version || '21' }}

      # Some servers derive diagnostics from an external linter named in the
      # recipe `note` (bash-language-server → shellcheck,
      # ansible-language-server → ansible-lint, elm-language-server → the elm
      # compiler). Provisioned here so the intentional diagnostic can publish.
      # (These should graduate to structured `runtime` fields.)
      - name: Provision diagnostic dependencies
        run: |
          set -euo pipefail
          case "${{ matrix.server }}" in
            bash-language-server)
              sudo apt-get update && sudo apt-get install -y shellcheck ;;
            ansible-language-server)
              pipx install ansible-lint || pip install ansible-lint ;;
            elm-language-server)
              # The npm `elm` package is a stub whose install SCRIPT
              # downloads the real compiler — dead under --ignore-scripts
              # (run-5 red: elm-language-server fine, nothing to compile
              # with). Fetch the pinned compiler binary directly; same
              # no-scripts posture. Pin cross-verified against two
              # independent public pinners (cashapp/hermit-packages elm.hcl,
              # chaotic-aur PKGBUILD).
              rel="releases/download/0.19.1/binary-for-linux-64-bit.gz"
              curl -sSL "https://github.com/elm/compiler/$rel" -o elm.gz
              want="e44af52bb27f725a973478e589d990a6428e115fe1bb14f0"
              want="${want}3833134d6c0f155c"
              actual="$(sha256sum elm.gz | cut -d' ' -f1)"
              if [ "$actual" != "$want" ]; then
                echo "sha256 mismatch for elm compiler"
                echo "  expected $want"
                echo "  actual   $actual"
                exit 1
              fi
              gunzip elm.gz
              chmod +x elm
              bindir="$HOME/.local/bin"; mkdir -p "$bindir"
              mv elm "$bindir/elm"
              echo "$bindir" >> "$GITHUB_PATH"
              # NO ELM_HOME pre-warm (maintainer ruling, 2026-07-08):
              # elm's cold-cache package fetch at first compile is the
              # product's bootstrap gap (misc 156), and conformance
              # must see it, not absorb it. A red here is the honest
              # signal until the settle engine models bootstrap.
              ;;
            *) echo "no extra diagnostic dependency for ${{ matrix.server }}" ;;
          esac

      # Log the elm toolchain identity BEFORE the conformance test (bug 138),
      # the Linux twin of the macOS step: an explicit `elm --version` on the
      # pinned compiler the previous step placed on PATH, so both platforms'
      # elm identity lands in the job log with no reconstruction. The two legs
      # pin the identical 0.19.1, so these two lines are the in-job proof they
      # verify the same toolchain.
      - name: Log elm toolchain identity
        if: matrix.server == 'elm-language-server'
        run: |
          set -euo pipefail
          echo "elm compiler on PATH: $(command -v elm)"
          echo "elm --version: $(elm --version)"

      # SKIPPED for an `auto-install` row (misc 212): that row dogfoods the
      # daemon's own self-healing install loop instead of this hand-rolled bash
      # mirror. The harness lets the SessionStart auto-install detect the
      # missing blessed server, fetch+verify it through the guided-install
      # engine, land it in the managed home, and pre-warm — so provisioning it
      # here would mask the exact loop the row exists to conform. A trust
      # ratchet: only proven-out rows flip; every `bash` row still installs.
      - name: Install pinned server (${{ matrix.server }})
        if: matrix.source == 'recipe' && matrix.provision != 'auto-install'
        run: |
          set -euo pipefail
          # lsm 04: a pinned official upstream release binary for this platform
          # is PREFERRED over the ecosystem install, mirroring the engine
          # (src/install.rs InstallPlan::resolve): fetch, verify OUR pinned SRI
          # hash BEFORE any unpack, unpack/place, expose the launcher on PATH
          # under the shipped server command (= basename artifact_bin).
          art_url="${{ matrix.artifact_url }}"
          if [ -n "$art_url" ]; then
            want="${{ matrix.artifact_hash }}"
            curl -sSL "$art_url" -o artifact.dl
            case "$want" in
              sha256-*) algo=sha256 ;;
              sha512-*) algo=sha512 ;;
              *)
                echo "artifact hash is not SRI: $want"
                exit 1 ;;
            esac
            digest="$(openssl dgst -$algo -binary artifact.dl | base64 -w0)"
            actual="$algo-$digest"
            if [ "$actual" != "$want" ]; then
              echo "SRI mismatch for $art_url"
              echo "  expected $want"
              echo "  actual   $actual"
              exit 1
            fi
            binrel="${{ matrix.artifact_bin }}"
            dest="$HOME/.managed/${{ matrix.server }}"
            mkdir -p "$dest" "$(dirname "$dest/$binrel")"
            case "$art_url" in
              *.tar.gz|*.tgz) tar -xzf artifact.dl -C "$dest" ;;
              *.gz)           gunzip -c artifact.dl > "$dest/$binrel" ;;
              # Anything else is a bare binary.
              *)              cp artifact.dl "$dest/$binrel" ;;
            esac
            chmod +x "$dest/$binrel"
            bindir="$HOME/.local/bin"; mkdir -p "$bindir"
            ln -sf "$dest/$binrel" "$bindir/$(basename "$binrel")"
            echo "$bindir" >> "$GITHUB_PATH"
            exit 0
          fi
          pkg="${{ matrix.package }}@${{ matrix.version }}"
          want="${{ matrix.hash }}"
          case "${{ matrix.ecosystem }}" in
            npm)
              # npm-tarball-sha512: fetch the exact tarball, verify OUR pinned
              # sha512, then install the verified artifact with
              # --ignore-scripts (install scripts never run).
              tarball="$(npm view "$pkg" dist.tarball)"
              curl -sSL "$tarball" -o pkg.tgz
              digest="$(openssl dgst -sha512 -binary pkg.tgz | base64 -w0)"
              actual="sha512-$digest"
              if [ -n "$want" ] && [ "$actual" != "$want" ]; then
                echo "integrity mismatch for $pkg"
                echo "  expected $want"
                echo "  actual   $actual"
                exit 1
              fi
              npm install -g --ignore-scripts ./pkg.tgz
              ;;
            cargo)
              cargo install "${{ matrix.package }}" --locked \
                --version "${{ matrix.version }}"
              ;;
            pip)
              if [ -n "$want" ]; then
                printf '%s --hash=sha256:%s\n' "$pkg" "$want" \
                  | sed 's/@/==/' > req.txt
                pip install --require-hashes -r req.txt
              else
                pip install "${{ matrix.package }}==${{ matrix.version }}"
              fi
              ;;
            go)
              go install "$pkg"
              echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
              ;;
            binary)
              # Reachable only when a binary recipe pins NO artifact for this
              # leg's platform — an unresolvable job, failed loudly (never a
              # silent skip).
              echo "binary recipe pins no artifact for this platform"
              exit 1 ;;
            *)
              echo "unknown ecosystem: ${{ matrix.ecosystem }}"; exit 1 ;;
          esac

      # Co-install a pinned npm package the server needs at runtime but does
      # not bundle (ts-ls → typescript/tsserver; misc 195). Same
      # npm-tarball-sha512 mechanics as the server itself: fetch the exact
      # tarball, verify OUR pinned sha512, install --ignore-scripts. So the gate
      # verifies against a KNOWN typescript version instead of the ubuntu runner
      # image's ambient global (an unpinned tsserver behind a pinned gate — the
      # exact thing the pin doctrine forbids). `matrix.co_install` is a JSON
      # list; `[]` for every other recipe makes the loop a no-op.
      # Also skipped for an `auto-install` row (misc 212): the engine installs a
      # recipe's co-installs with the server (misc 195), so the loop covers them
      # too — a hand-rolled co-install here would mask that.
      - name: Install pinned co-installs (${{ matrix.server }})
        if: >-
          matrix.source == 'recipe' && matrix.provision != 'auto-install'
          && toJson(matrix.co_install) != '[]'
        env:
          CO_INSTALL: ${{ toJson(matrix.co_install) }}
        run: |
          set -euo pipefail
          echo "$CO_INSTALL" | jq -c '.[]' | while read -r co; do
            copkg="$(echo "$co" | jq -r '.package')"
            cover="$(echo "$co" | jq -r '.version')"
            cowant="$(echo "$co" | jq -r '.hash')"
            spec="$copkg@$cover"
            tarball="$(npm view "$spec" dist.tarball)"
            curl -sSL "$tarball" -o co.tgz
            digest="$(openssl dgst -sha512 -binary co.tgz | base64 -w0)"
            actual="sha512-$digest"
            if [ -n "$cowant" ] && [ "$actual" != "$cowant" ]; then
              echo "integrity mismatch for co-install $spec"
              echo "  expected $cowant"
              echo "  actual   $actual"
              exit 1
            fi
            npm install -g --ignore-scripts ./co.tgz
          done

      # CI-only provisioning (tui-rework 10): obtain a server that no user-grade
      # ecosystem recipe can carry. One branch per provisioning `kind`. Pending
      # stanzas never reach here — conformance_matrix.py drops them (an
      # unresolved pin can't be installed).
      - name: Provision server (${{ matrix.kind }} ${{ matrix.server }})
        if: matrix.source == 'provision'
        run: |
          set -euo pipefail
          case "${{ matrix.kind }}" in
            rustup-component)
              # Rides the pinned toolchain; the component adds the binary.
              rustup component add "${{ matrix.component }}"
              # The ~/.cargo/bin proxy shim resolves the DEFAULT toolchain
              # outside the repo (the bridge spawns servers in a tempdir),
              # where the component is absent — put the real binary first
              # on PATH (GITHUB_PATH prepends).
              real="$(rustup which "${{ matrix.component }}")"
              bindir="$HOME/.local/bin"; mkdir -p "$bindir"
              ln -sf "$real" "$bindir/${{ matrix.component }}"
              echo "$bindir" >> "$GITHUB_PATH"
              ;;
            system-apt)
              sudo apt-get update && sudo apt-get install -y "${{ matrix.apt }}"
              ;;
            github-release-sha256)
              # Fetch the pinned asset, verify OUR pinned sha256, then place
              # its launcher on PATH under the shipped server command
              # (= basename bin).
              rel="releases/download/${{ matrix.version }}/${{ matrix.asset }}"
              url="https://github.com/${{ matrix.repo }}/$rel"
              curl -sSL "$url" -o asset.dl
              actual="$(sha256sum asset.dl | cut -d' ' -f1)"
              if [ "$actual" != "${{ matrix.sha256 }}" ]; then
                echo "sha256 mismatch for ${{ matrix.asset }}"
                echo "  expected ${{ matrix.sha256 }}"
                echo "  actual   $actual"
                exit 1
              fi
              binrel="${{ matrix.bin }}"
              dest="$HOME/.provision/${{ matrix.server }}"
              mkdir -p "$dest"
              case "${{ matrix.asset }}" in
                *.tar.gz|*.tgz) tar -xzf asset.dl -C "$dest" ;;
                *.zip)          unzip -q asset.dl -d "$dest" ;;
                # Anything else is a bare binary.
                *)              cp asset.dl "$dest/$binrel" ;;
              esac
              chmod +x "$dest/$binrel"
              bindir="$HOME/.local/bin"; mkdir -p "$bindir"
              ln -sf "$dest/$binrel" "$bindir/$(basename "$binrel")"
              echo "$bindir" >> "$GITHUB_PATH"
              ;;
            cargo-git-locked)
              # Reproducible source build pinned to an exact commit.
              cargo install --git "${{ matrix.git }}" --locked \
                --rev "${{ matrix.rev }}" "${{ matrix.server }}"
              ;;
            tarball-sha256)
              url="${{ matrix.url }}"
              curl -sSL "$url" -o asset.dl
              actual="$(sha256sum asset.dl | cut -d' ' -f1)"
              if [ "$actual" != "${{ matrix.sha256 }}" ]; then
                echo "sha256 mismatch for $url"; exit 1
              fi
              binrel="${{ matrix.bin }}"
              dest="$HOME/.provision/${{ matrix.server }}"
              mkdir -p "$dest"
              tar -xzf asset.dl -C "$dest"
              bindir="$HOME/.local/bin"; mkdir -p "$bindir"
              ln -sf "$dest/$binrel" "$bindir/$(basename "$binrel")"
              echo "$bindir" >> "$GITHUB_PATH"
              ;;
            gem)
              # RubyGems carries no npm-grade integrity — the exact-version
              # pin plus RubyGems' index is the verification (recorded
              # honestly). --user-install: the runner's system gem dir is
              # root-owned (first dispatch failed on it).
              gem install "${{ matrix.gem }}" --user-install \
                --version "${{ matrix.version }}"
              # ruby-lsp's launcher composes its bundle via `bundle`
              # (run-8 stderr: "sh: 1: bundle: not found" → Errno::ENOENT
              # death). Provision bundler into the same user gem dir.
              gem install bundler --user-install
              userbin="$(ruby -e 'puts Gem.user_dir')/bin"
              echo "$userbin" >> "$GITHUB_PATH"
              # The runner's RubyGems derives Gem.user_dir from
              # XDG_DATA_HOME, which the harness's isolate_env re-points
              # at the test tempdir — the spawned server then can't find
              # its own gems (run-5 red: instant GemNotFoundException).
              # GEM_PATH survives isolate_env (only CATENARY_* is
              # cleared), so the lookup holds wherever XDG points.
              echo "GEM_PATH=$(ruby -e 'puts Gem.user_dir')" \
                >> "$GITHUB_ENV"
              # GEM_HOME too: ruby-lsp's composed bundle runs
              # `bundle install` at boot, and without GEM_HOME bundler
              # installs into the root-owned system gem dir (run-9 red:
              # Bundler::PermissionError on /var/lib/gems, 4x retries
              # per gem for ~50s, then server death).
              echo "GEM_HOME=$(ruby -e 'puts Gem.user_dir')" \
                >> "$GITHUB_ENV"
              ;;
            *)
              echo "unknown provisioning kind: ${{ matrix.kind }}"; exit 1 ;;
          esac

      - name: Run conformance harness (${{ matrix.server }})
        env:
          CATENARY_CONFORMANCE: ${{ matrix.server }}
          # Pin the harness tempdirs somewhere uploadable, and keep them
          # past Drop/panic-unwind (run 6 uploaded ZERO artifacts: every
          # log lived in a TempDir wiped during unwind before the upload
          # step ran).
          TMPDIR: ${{ runner.temp }}/conformance
          CATENARY_CONFORMANCE_KEEP: "1"
        # The prebuilt libtest binary runs directly — no toolchain, no
        # compile. ONLY the matrix entry point runs: the per-server
        # skip-if-missing sentinels are for local dev, and on runners the
        # rustup proxy shim (~/.cargo/bin/rust-analyzer, no component behind
        # it) defeats their binary-missing skip — the second dispatch failed
        # all 23 harness jobs on that one poisoned sentinel.
        #
        # --nocapture (brackets 06): libtest hides a PASSING test's stderr,
        # which would swallow the single-file evidence line ("SERVES
        # DIAGNOSTICS" / "FINDING") the harness now emits per server — the
        # record a `single_file` manifest-row upgrade cites. One test runs, so
        # uncaptured output cannot interleave.
        run: |
          mkdir -p "$TMPDIR"
          ./dist/conformance_harness conformance_selected_server --nocapture

      # The server's own stderr is NOT bridge_stderr.log — it is piped into
      # the daemon and re-emitted as `lsp.stderr` events in the JSONL
      # firehose (under the tempdir's cache base, in the per-server
      # `servers/<server>@<root>.jsonl` shard); the daemon's stderr goes to
      # state/catenary/daemon.log. Collect all three log families as LOOSE
      # FILES into one triage dir (misc 213): GitHub already zips every
      # artifact and `gh run download` transparently extracts that layer, so
      # tar'ing first (the retired `triage.tgz`) was a second, redundant
      # packing that only demanded `tar` on the reader — which the agent
      # triage surface lacks. We mirror the relative subtree (no name
      # collisions across bridges) and rewrite the one NTFS-invalid path
      # component: the firehose instance dir `daemon:<uuid>` (colon is
      # NTFS-invalid; bug 86) is copied to `daemon-<uuid>`, so the loose
      # upload is portable without a tarball.
      - name: Collect triage logs (failure only)
        if: failure()
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/conformance"
          dst="$RUNNER_TEMP/triage"
          [ -d "$src" ] || exit 0
          rm -rf "$dst"; mkdir -p "$dst"
          cd "$src"
          find . \( -name 'daemon.log' -o -name '*.jsonl' \
            -o -name 'bridge_stderr*.log' \) -print0 \
            | while IFS= read -r -d '' f; do
                rel="${f#./}"
                safe="$dst/${rel//:/-}"
                mkdir -p "$(dirname "$safe")"
                cp "$f" "$safe"
              done

      # Name the cause in the job log (bug 138): the LS's own stderr rides the
      # firehose as `lsp.stderr` events (source="lsp.stderr", method="stderr",
      # payload=<the line>), so on failure we pull the last ~50 of them from
      # the collected JSONL and print them into the step output. The elm
      # incident's signatures — "Cannot find executable", "ELM VERSION
      # MISMATCH", non-JSON stderr, wasm path errors — then appear here
      # directly, so the log itself names the cause without downloading the
      # bundle. `jq` reads the `payload` field of each stderr record; a
      # non-JSON stderr line was preserved verbatim as a JSON string payload
      # (jsonl_sink parse_payload fallback), so it still prints.
      - name: Summarize LS stderr (failure only)
        if: failure()
        run: |
          set -euo pipefail
          dst="$RUNNER_TEMP/triage"
          [ -d "$dst" ] || { echo "no triage dir to summarize"; exit 0; }
          # source == "lsp.stderr" selects the stderr events across every
          # collected firehose shard; print each event's raw payload line.
          # Tolerate a torn final line (a crash can leave the firehose tail
          # unterminated) with `jq -R 'fromjson? // empty'`. Collect into one
          # file first so the found-count survives the pipeline (a piped
          # while-loop runs in a subshell).
          all="$RUNNER_TEMP/lsp_stderr_all.txt"
          : > "$all"
          find "$dst" -name '*.jsonl' -print0 \
            | while IFS= read -r -d '' log; do
                jq -R 'fromjson? // empty
                  | select(.source == "lsp.stderr")
                  | .payload' -r "$log" 2>/dev/null >> "$all" || true
              done
          echo "── last 50 lsp.stderr lines (the LS's own stderr) ──"
          if [ -s "$all" ]; then
            tail -n 50 "$all"
          else
            echo "(no lsp.stderr events in the firehose — the server emitted"
            echo " nothing on stderr, or died before the reader attached)"
          fi

      - name: Upload triage logs (failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Loose files (misc 213): the artifact is the triage DIRECTORY, so
          # `gh run download` yields directly readable daemon.log / *.jsonl /
          # bridge_stderr*.log with no tar step on the reader.
          name: triage-${{ matrix.server }}
          path: ${{ runner.temp }}/triage
          if-no-files-found: ignore
          retention-days: 7

      - name: Emit blessed entry
        run: |
          set -euo pipefail
          mkdir -p blessed
          # Host-riding provisions (rustup component, apt) carry no pin
          # version; capture the actually-conformed version from the binary
          # so the candidate manifest is honest.
          ver="${{ matrix.version }}"
          if [ -z "$ver" ]; then
            case "${{ matrix.server }}" in
              rust-analyzer)
                # The provision step linked the real component ahead of the
                # rustup proxy shim on PATH (misc 162), so the bare key resolves
                # the component and reports the toolchain's honest version.
                ra="rust-analyzer"
                ver="$($ra --version 2>/dev/null | head -1 || true)" ;;
              clangd)
                ver="$(clangd --version 2>/dev/null | head -1 || true)" ;;
              *) ver="unknown" ;;
            esac
          fi
          # Platform-qualified row (misc 164): the linux-x86_64 rows share the
          # ONE committed blessed-manifest.toml with the macos-arm64 rows.
          cat > "blessed/${{ matrix.server }}.toml" <<EOF
          [blessed.${{ matrix.server }}.linux-x86_64]
          version = "$ver"
          platform = "linux-x86_64"
          date = "$(date -u +%Y-%m-%d)"
          tier = "verified-on-linux"
          EOF
          cat "blessed/${{ matrix.server }}.toml"

      - name: Upload blessed entry
        uses: actions/upload-artifact@v7
        with:
          name: blessed-${{ matrix.server }}
          path: blessed/${{ matrix.server }}.toml
          retention-days: 7

  # The macOS leg (misc 164): the FULL Linux conformance set, on Apple silicon
  # only — the same server list blesses on both platforms (maintainer ruling
  # 2026-07-10). Brew-primary, with a server that has no homebrew-core formula
  # riding its platform-neutral Linux kind, referenced from
  # defaults/ci-provision-macos.toml (a `linux-recipe` reuses the Linux npm
  # recipe; `linux-provision` reuses the Linux cargo-git-locked provision), so
  # there are zero skips. "Clear" on macOS inherits the Linux legs' honest-red
  # semantics (e.g. the misc 156 cold-bootstrap ruling), not a literal
  # all-green.
  conform-macos:
    name: "Conform ${{ matrix.server }} (macOS)"
    needs: [discover, build-macos]
    if: needs.discover.outputs.empty_macos != 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix_macos) }}
    env:
      # One explicit `brew update` in the validate step fetches current
      # formula metadata; per-command auto-update would re-pay that cost on
      # every brew invocation.
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v5

      # The leg is brew-primary, but a server with no homebrew-core formula
      # rides its platform-neutral Linux kind (misc 164, maintainer ruling
      # 2026-07-10): `linux-recipe` reuses the Linux npm recipe,
      # `linux-provision` reuses the Linux cargo-git-locked provision. Only the
      # cargo-git build (`lattice`) needs a toolchain; brew-only and npm jobs
      # skip this step, so no compile happens on them.
      - name: Provision Rust toolchain (cargo-git-locked source build)
        # `prov_kind` is empty on brew/npm jobs, so only a cargo-git build
        # (lattice) pulls a toolchain — brew-only and npm jobs skip it.
        if: matrix.prov_kind == 'cargo-git-locked'
        run: rustup show

      - name: Fetch prebuilt harness
        uses: actions/download-artifact@v8
        with:
          name: conformance-dist-macos
          path: dist

      - name: Install prebuilt binaries at their baked paths
        run: |
          set -euo pipefail
          mkdir -p target/debug
          cp dist/target/debug/* target/debug/
          chmod +x target/debug/* dist/conformance_harness

      # Bottle downloads dominate provisioning time; the cache key rides the
      # pin file so a stanza edit refreshes it. Homebrew jobs only.
      - name: Cache Homebrew downloads
        if: matrix.kind == 'homebrew'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: "brew-${{ matrix.server }}-\
            ${{ hashFiles('defaults/ci-provision-macos.toml') }}"
          restore-keys: |
            brew-${{ matrix.server }}-

      # Blind-iteration aid (misc 164): a wrong or renamed formula name fails
      # HERE, as a provisioning error with the resolved version echoed —
      # never as a mysterious conformance red downstream. Homebrew jobs only.
      - name: Validate formula (${{ matrix.formula }})
        if: matrix.kind == 'homebrew'
        run: |
          set -euo pipefail
          brew update --quiet
          brew info --json=v2 "${{ matrix.formula }}" \
            | jq -r '.formulae[0] | "\(.name) \(.versions.stable)"'

      # Same contract as the Linux leg: a server whose diagnostics come from
      # an external tool gets it provisioned so the intentional diagnostic
      # can publish. shellcheck / ansible-lint ride brew (the macOS
      # provisioning surface), but the elm COMPILER is pinned + hash-verified
      # off the GitHub release, NOT `brew install elm` (bug 138): brew's
      # `elm` formula floats with homebrew-core HEAD, and the 07-15 runner
      # image poured elm 0.19.2 against the fixture's `elm-version: "0.19.1"`
      # pin — which elm-language-server silently publishes CLEAN on, sinking
      # the intentional diagnostic. So we pin the compiler exactly as the
      # Linux leg does, to the SAME 0.19.1, off the SAME release: fetch the
      # arm64 mac asset, verify OUR pinned sha256 BEFORE unpacking, place the
      # launcher on PATH. The pin is cross-verified against cashapp/
      # hermit-packages (elm.hcl) — the same public-pinner discipline the
      # Linux leg records — and 0.19.1 DOES ship an arm64 mac asset
      # (`binary-for-mac-64-bit-ARM.gz`), so no Rosetta and no fixture bump:
      # both legs verify the identical 0.19.1 compiler.
      # NO ELM_HOME pre-warm, same maintainer ruling as the Linux leg
      # (misc 156): the cold-bootstrap behavior is conformance's to see.
      - name: Provision diagnostic dependencies
        run: |
          set -euo pipefail
          case "${{ matrix.server }}" in
            bash-language-server)     brew install shellcheck ;;
            ansible-language-server)  brew install ansible-lint ;;
            elm-language-server)
              # Pinned elm 0.19.1 arm64 mac compiler (bug 138). Same posture
              # as the Linux leg's elm branch above: fetch, verify OUR pinned
              # sha256, gunzip, place on PATH. The GitHub release ships no
              # per-asset digest, so the hash is OURS, cross-verified against
              # cashapp/hermit-packages elm.hcl.
              rel="releases/download/0.19.1/binary-for-mac-64-bit-ARM.gz"
              curl -sSL "https://github.com/elm/compiler/$rel" -o elm.gz
              want="552c8300b55dafdf52073b095e7bc6afc1b2ea2"
              want="${want}a600fbc7654bca8a241e38689"
              actual="$(shasum -a 256 elm.gz | cut -d' ' -f1)"
              if [ "$actual" != "$want" ]; then
                echo "sha256 mismatch for elm compiler (macOS arm64)"
                echo "  expected $want"
                echo "  actual   $actual"
                exit 1
              fi
              gunzip elm.gz
              chmod +x elm
              bindir="$HOME/.local/bin"; mkdir -p "$bindir"
              mv elm "$bindir/elm"
              echo "$bindir" >> "$GITHUB_PATH"
              ;;
            *) echo "no extra diagnostic dependency for ${{ matrix.server }}" ;;
          esac

      # Log the elm toolchain identity BEFORE the conformance test (bug 138):
      # an explicit `elm --version` on the version the previous step just
      # pinned onto PATH, so the next incident reads the compiler identity off
      # the job log directly instead of reconstructing it from install lines.
      # elm-language-server only — every other server's compiler/runtime
      # identity is echoed by the `Echo provisioned binary` step below.
      - name: Log elm toolchain identity
        if: matrix.server == 'elm-language-server'
        run: |
          set -euo pipefail
          echo "elm compiler on PATH: $(command -v elm)"
          echo "elm --version: $(elm --version)"

      - name: Install server via Homebrew (${{ matrix.formula }})
        if: matrix.kind == 'homebrew'
        run: |
          set -euo pipefail
          # --overwrite: a dependency's link step can collide with the runner
          # image's preinstalled kegs (run 29089146722: vscode-langservers-
          # extracted failed on `Could not symlink bin/openssl`). The runner is
          # ephemeral — clobbering its preinstalled links is safe and keeps a
          # brew-infra collision from reading as a conformance red.
          brew install --overwrite "${{ matrix.formula }}"
          # A keg-only formula (llvm → clangd) links nothing into
          # $(brew --prefix)/bin; `bin` names the launcher within the keg,
          # and the server key IS the executable (misc 162), so the
          # symlink's basename is the shipped command.
          if [ -n "${{ matrix.bin }}" ]; then
            src="$(brew --prefix "${{ matrix.formula }}")/${{ matrix.bin }}"
            test -x "$src"
            bindir="$HOME/.local/bin"; mkdir -p "$bindir"
            ln -sf "$src" "$bindir/${{ matrix.server }}"
            echo "$bindir" >> "$GITHUB_PATH"
          fi

      # A neutral-kind `linux-recipe` server: install the pinned npm version by
      # the SAME mechanics as the Linux leg (fetch the exact tarball, verify OUR
      # pinned sha512, install the verified artifact with --ignore-scripts). The
      # macos-latest image ships node. The generator resolved the package /
      # version / hash from the referenced Linux recipe, so a Linux pin bump
      # flows through here with no second pin to maintain.
      #
      # SKIPPED for an `auto-install` row (misc 212): the referenced recipe's
      # provisioning rides along, so tombi's flip reaches the macOS leg too —
      # the harness dogfoods the daemon's auto-install loop instead of this bash
      # install, on BOTH platforms.
      - name: Install pinned server (linux-recipe ${{ matrix.server }})
        if: matrix.kind == 'linux-recipe' && matrix.provision != 'auto-install'
        run: |
          set -euo pipefail
          case "${{ matrix.ecosystem }}" in
            npm)
              pkg="${{ matrix.package }}@${{ matrix.version }}"
              want="${{ matrix.hash }}"
              tarball="$(npm view "$pkg" dist.tarball)"
              curl -sSL "$tarball" -o pkg.tgz
              # BSD base64 (macOS) wraps at 76 cols and has no -w0; strip any
              # newline so the 88-char SRI digest compares as one line.
              raw="$(openssl dgst -sha512 -binary pkg.tgz | base64)"
              actual="sha512-$(printf '%s' "$raw" | tr -d '\n')"
              if [ -n "$want" ] && [ "$actual" != "$want" ]; then
                echo "integrity mismatch for $pkg"
                echo "  expected $want"
                echo "  actual   $actual"
                exit 1
              fi
              npm install -g --ignore-scripts ./pkg.tgz
              ;;
            *)
              echo "unsupported linux-recipe ecosystem: ${{ matrix.ecosystem }}"
              exit 1 ;;
          esac

      # Co-install the recipe's pinned npm packages on the macOS leg too (misc
      # 195): the linux-recipe rides the Linux npm recipe, so its co-installs
      # flow through with it. This is the whole point of the ticket — the
      # macos-latest image ships NO ambient typescript, so ts-ls died
      # deterministically at initialize ("Could not find a valid TypeScript
      # installation") until this step pinned tsserver. Same BSD-base64 handling
      # as the server install above (no -w0; strip newlines). `[]` → no-op.
      # Also skipped for an `auto-install` row (misc 212): the engine
      # co-installs them with the server, so the loop covers the macOS leg too.
      - name: Install pinned co-installs (linux-recipe ${{ matrix.server }})
        if: >-
          matrix.kind == 'linux-recipe' && matrix.provision != 'auto-install'
          && toJson(matrix.co_install) != '[]'
        env:
          CO_INSTALL: ${{ toJson(matrix.co_install) }}
        run: |
          set -euo pipefail
          echo "$CO_INSTALL" | jq -c '.[]' | while read -r co; do
            copkg="$(echo "$co" | jq -r '.package')"
            cover="$(echo "$co" | jq -r '.version')"
            cowant="$(echo "$co" | jq -r '.hash')"
            spec="$copkg@$cover"
            tarball="$(npm view "$spec" dist.tarball)"
            curl -sSL "$tarball" -o co.tgz
            raw="$(openssl dgst -sha512 -binary co.tgz | base64)"
            actual="sha512-$(printf '%s' "$raw" | tr -d '\n')"
            if [ -n "$cowant" ] && [ "$actual" != "$cowant" ]; then
              echo "integrity mismatch for co-install $spec"
              echo "  expected $cowant"
              echo "  actual   $actual"
              exit 1
            fi
            npm install -g --ignore-scripts ./co.tgz
          done

      # A neutral-kind `linux-provision` server: reuse the referenced Linux
      # provision's mechanics. The lattice dogfood is `cargo-git-locked` — a
      # reproducible source build pinned to an exact commit with --locked. The
      # generator resolved git / rev / version from the referenced Linux stanza.
      - name: Provision server (linux-provision ${{ matrix.server }})
        if: matrix.kind == 'linux-provision'
        run: |
          set -euo pipefail
          case "${{ matrix.prov_kind }}" in
            cargo-git-locked)
              cargo install --git "${{ matrix.git }}" --locked \
                --rev "${{ matrix.rev }}" "${{ matrix.server }}"
              ;;
            *)
              echo "unsupported linux-provision kind: ${{ matrix.prov_kind }}"
              exit 1 ;;
          esac

      # The resolved binary and its version land in the step log, so a
      # provisioning miss reads as a provisioning miss. `brew list` runs only
      # for a homebrew job (a neutral-kind job has no formula).
      #
      # SKIPPED for an `auto-install` row (misc 212): nothing is on PATH yet —
      # the binary lands in the managed home only when the harness kicks the
      # loop, so a `which` here would fail a not-yet-installed server. The
      # harness's own wait-for-land + managed-home check is that row's proof.
      - name: Echo provisioned binary
        if: matrix.provision != 'auto-install'
        run: |
          set -euo pipefail
          which "${{ matrix.server }}"
          "${{ matrix.server }}" --version || true
          if [ "${{ matrix.kind }}" = "homebrew" ]; then
            brew list --versions "${{ matrix.formula }}"
          fi

      - name: Run conformance harness (${{ matrix.server }})
        env:
          CATENARY_CONFORMANCE: ${{ matrix.server }}
          # Same rationale as the Linux leg: pin the harness tempdirs
          # somewhere uploadable and keep them past Drop/panic-unwind.
          # RUNNER_TEMP on macOS is under /Users/runner/work/_temp, which
          # also sidesteps the /var → /private/var symlink class the ticket
          # flags for tempdir-canonicalization bugs.
          TMPDIR: ${{ runner.temp }}/conformance
          CATENARY_CONFORMANCE_KEEP: "1"
        # --nocapture (brackets 06): same rationale as the Linux leg — the
        # per-server single-file evidence line must land in the job log.
        run: |
          mkdir -p "$TMPDIR"
          ./dist/conformance_harness conformance_selected_server --nocapture

      # Loose-file triage collection (misc 213), the macOS twin of the Linux
      # step: same three log families, same colon-sanitized subtree mirror
      # (the `daemon:<uuid>` firehose dir, bug 86), uploaded as LOOSE FILES so
      # `gh run download` yields directly readable logs with no tar step on
      # the reader. BSD find accepts the same -print0 contract as the GNU pair;
      # the `run:` shell is bash on the macos runner, so the read -d '' /
      # ${rel//:/-} builtins hold.
      - name: Collect triage logs (failure only)
        if: failure()
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/conformance"
          dst="$RUNNER_TEMP/triage"
          [ -d "$src" ] || exit 0
          rm -rf "$dst"; mkdir -p "$dst"
          cd "$src"
          find . \( -name 'daemon.log' -o -name '*.jsonl' \
            -o -name 'bridge_stderr*.log' \) -print0 \
            | while IFS= read -r -d '' f; do
                rel="${f#./}"
                safe="$dst/${rel//:/-}"
                mkdir -p "$(dirname "$safe")"
                cp "$f" "$safe"
              done

      # Name the cause in the job log (bug 138), the macOS twin of the Linux
      # summarize step: pull the last ~50 `lsp.stderr` payload lines from the
      # collected firehose JSONL so the elm signatures ("Cannot find
      # executable", "ELM VERSION MISMATCH", non-JSON stderr, wasm path
      # errors) surface directly in the step output.
      - name: Summarize LS stderr (failure only)
        if: failure()
        run: |
          set -euo pipefail
          dst="$RUNNER_TEMP/triage"
          [ -d "$dst" ] || { echo "no triage dir to summarize"; exit 0; }
          all="$RUNNER_TEMP/lsp_stderr_all.txt"
          : > "$all"
          find "$dst" -name '*.jsonl' -print0 \
            | while IFS= read -r -d '' log; do
                jq -R 'fromjson? // empty
                  | select(.source == "lsp.stderr")
                  | .payload' -r "$log" 2>/dev/null >> "$all" || true
              done
          echo "── last 50 lsp.stderr lines (the LS's own stderr) ──"
          if [ -s "$all" ]; then
            tail -n 50 "$all"
          else
            echo "(no lsp.stderr events in the firehose — the server emitted"
            echo " nothing on stderr, or died before the reader attached)"
          fi

      - name: Upload triage logs (failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Loose files (misc 213): upload the triage DIRECTORY, not a tgz.
          name: triage-macos-${{ matrix.server }}
          path: ${{ runner.temp }}/triage
          if-no-files-found: ignore
          retention-days: 7

      - name: Emit blessed entry
        run: |
          set -euo pipefail
          mkdir -p blessed
          # The honest pin record depends on the kind. A homebrew stanza carries
          # no version pin (homebrew-core cannot install a historical version —
          # see ci-provision-macos.toml), so the conformed version is captured
          # from the installed formula. A neutral-kind stanza rides the
          # referenced Linux pin, so its conformed version IS that pin
          # (matrix.version), recorded exactly.
          if [ "${{ matrix.kind }}" = "homebrew" ]; then
            ver="$(brew list --versions "${{ matrix.formula }}" \
              | head -1 | awk '{print $2}')"
          else
            ver="${{ matrix.version }}"
          fi
          test -n "$ver"
          # Platform-qualified row (misc 164): the macos-arm64 rows land in the
          # ONE committed blessed-manifest.toml alongside the linux-x86_64 rows.
          cat > "blessed/${{ matrix.server }}.toml" <<EOF
          [blessed.${{ matrix.server }}.macos-arm64]
          version = "$ver"
          platform = "macos-arm64"
          date = "$(date -u +%Y-%m-%d)"
          tier = "verified-on-macos"
          EOF
          cat "blessed/${{ matrix.server }}.toml"

      - name: Upload blessed entry
        uses: actions/upload-artifact@v7
        with:
          # `macos-blessed-*` is disjoint from the Linux `blessed-*` pattern,
          # so neither bless job downloads the other platform's entries.
          name: macos-blessed-${{ matrix.server }}
          path: blessed/${{ matrix.server }}.toml
          retention-days: 7

  bless:
    name: Assemble blessed-manifest
    needs: [discover, conform]
    # Assemble whatever conformed: a red server simply has no entry to
    # download, so a partial matrix still yields its candidate manifest
    # (first live run: one red job silently skipped all 23 green blessings).
    # Skip only on cancellation or an empty matrix.
    if: ${{ !cancelled() && needs.discover.outputs.empty != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download conformed entries
        uses: actions/download-artifact@v8
        with:
          pattern: blessed-*
          path: entries
          merge-multiple: true

      - name: Assemble candidate manifest
        run: |
          set -euo pipefail
          # Start from the committed manifest's header comment, then append
          # every entry that conformed green this run. Each row is now
          # platform-qualified (`[blessed.<server>.linux-x86_64]`; misc 164), so
          # a macOS `macos-arm64` row for the same server is a distinct table
          # path — the two platforms' candidate rows merge into the ONE
          # blessed-manifest.toml with no schema decision. This is a CANDIDATE
          # artifact for review — nothing is pushed; the maintainer blesses by
          # committing the conformed rows into defaults/blessed-manifest.toml.
          out=candidate-blessed-manifest.toml
          sed -n '/^#/p' defaults/blessed-manifest.toml > "$out"
          echo >> "$out"
          for f in $(find entries -name '*.toml' | sort); do
            cat "$f" >> "$out"
            echo >> "$out"
          done
          # shellcheck disable=SC2016 # literal markdown backticks, no expansion
          {
            echo '## Candidate blessed-manifest — Linux rows (this run)';
            echo '';
            echo 'Copy the conformed `linux-x86_64` rows below into';
            echo '`defaults/blessed-manifest.toml` to bless them — nothing';
            echo 'is pushed automatically. macOS `macos-arm64` rows arrive in';
            echo 'the bless-macos job and merge into the SAME file.';
            echo '';
            echo '```toml';
            cat "$out";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate manifest
        uses: actions/upload-artifact@v7
        with:
          name: candidate-blessed-manifest
          path: candidate-blessed-manifest.toml
          retention-days: 30

  bless-macos:
    name: Assemble blessed-manifest (macOS)
    needs: [discover, conform-macos]
    # Same partial-matrix semantics as the Linux bless: a red server simply
    # has no entry to download, so whatever conformed still yields its
    # candidate manifest. Skip only on cancellation or an empty macOS matrix.
    if: ${{ !cancelled() && needs.discover.outputs.empty_macos != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download conformed entries
        uses: actions/download-artifact@v8
        with:
          pattern: macos-blessed-*
          path: entries
          merge-multiple: true

      - name: Assemble candidate macOS rows
        run: |
          set -euo pipefail
          # macOS rows now merge into the ONE committed blessed-manifest.toml:
          # rows are platform-qualified (`[blessed.<server>.macos-arm64]`;
          # misc 164), a distinct table path from the same server's
          # linux-x86_64 row, so no schema decision is needed. This candidate
          # carries JUST the macos-arm64 rows (no header — the file already has
          # one) for the maintainer to append alongside the Linux rows; nothing
          # is pushed automatically.
          out=candidate-blessed-rows-macos.toml
          : > "$out"
          for f in $(find entries -name '*.toml' | sort); do
            cat "$f" >> "$out"
            echo >> "$out"
          done
          # shellcheck disable=SC2016 # literal markdown backticks, no expansion
          {
            echo '## Candidate blessed-manifest — macOS rows (this run)';
            echo '';
            echo 'Append the conformed `macos-arm64` rows below into';
            echo '`defaults/blessed-manifest.toml` (the SAME file the Linux';
            echo 'rows land in) to bless them — nothing is pushed.';
            echo '';
            echo '```toml';
            cat "$out";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate macOS rows
        uses: actions/upload-artifact@v7
        with:
          name: candidate-blessed-rows-macos
          path: candidate-blessed-rows-macos.toml
          retention-days: 30
