---
name: Conformance

# Language-server conformance harness (tui-rework 07): install each pinned,
# hash-verified server on the runner, then drive the REAL Catenary lifecycle
# against its fixture (initialize with the shipped default config → edit →
# diagnostics batch with settle → collect → shutdown), asserting settle reaches
# idle inside a finite wall bound, the intentional diagnostic publishes, and
# shutdown is clean.
#
# Cadence rides the pins (a pinned, hash-verified artifact cannot drift, so a
# schedule proves nothing): the matrix runs when a recipe / defaults / fixture
# / harness file changes. It is diff-scoped on ordinary recipe edits and full
# on refresh-recipes PRs (where every pin can move) or any structural change.
#
# Blessing = the green matrix job + the human review of the PR. This workflow
# EMITS a candidate blessed-manifest as a build artifact (server → conformed
# version / platform / date); nothing is pushed — the maintainer blesses by
# committing the conformed entries in the reviewed PR.

"on":
  pull_request:
    branches: [main]
    paths:
      - "defaults/recipes.toml"
      - "defaults/ci-provision.toml"
      - "defaults/servers.toml"
      - "defaults/languages.toml"
      - "tests/fixtures/conformance/**"
      - "tests/conformance_harness.rs"
      - "tests/common/mod.rs"
      - "tools/refresh_recipes.py"
      - "tools/conformance_matrix.py"
      - ".github/workflows/conformance.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  discover:
    name: Discover matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      empty: ${{ steps.gen.outputs.empty }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # base ref needed for diff-scoping

      - name: Generate matrix
        id: gen
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          scope_full=1
          # workflow_dispatch (no PR base) and structural changes run the full
          # matrix; an ordinary recipe/provision edit is diff-scoped to the
          # changed stanzas of whichever pin file(s) moved.
          if [ -n "$base" ]; then
            changed="$(git diff --name-only "$base" "${{ github.sha }}")"
            echo "changed files:"; echo "$changed"
            # Only the two pin files are diff-scopeable; any other changed file
            # (a fixture, the harness, servers/languages) may affect any server.
            pins='^defaults/(recipes|ci-provision)\.toml$'
            if echo "$changed" | grep -qvE "$pins"; then
              scope_full=1
            else
              scope_full=0
            fi
          fi
          if [ "$scope_full" -eq 0 ]; then
            # Diff-scope BOTH sources against their base. A file that did not
            # change compares equal to its base → zero jobs from it, so a
            # recipes-only edit still scopes to changed recipes (and vice
            # versa).
            git show "$base:defaults/recipes.toml" > /tmp/base-recipes.toml
            git show "$base:defaults/ci-provision.toml" > /tmp/base-prov.toml
            matrix="$(python3 tools/conformance_matrix.py \
              --base-recipes /tmp/base-recipes.toml \
              --base-provision /tmp/base-prov.toml)"
          else
            matrix="$(python3 tools/conformance_matrix.py)"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          njobs='import json,sys; print(len(json.load(sys.stdin)["include"]))'
          count="$(printf '%s' "$matrix" | python3 -c "$njobs")"
          if [ "$count" -eq 0 ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

  # Build the harness + catenary binaries ONCE; every matrix job downloads
  # and executes them instead of recompiling (~1 min × 24 jobs saved). Safe
  # because cargo bakes CARGO_BIN_EXE_*/CARGO_MANIFEST_DIR as absolute
  # paths at compile time and every ubuntu runner checks out to the same
  # /home/runner/work/<repo>/<repo> — the matrix restores the binaries at
  # those exact paths.
  build:
    name: Build harness once
    needs: discover
    if: needs.discover.outputs.empty != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Compile harness and binaries
        run: |
          set -euo pipefail
          cargo test --test conformance_harness --features mockls \
            --no-run --message-format=json > cargo-build.jsonl
          exe="$(jq -r 'select(.reason=="compiler-artifact")
            | select(.target.name=="conformance_harness")
            | .executable // empty' cargo-build.jsonl | tail -n1)"
          test -n "$exe"
          mkdir -p dist/target/debug
          cp "$exe" dist/conformance_harness
          cp target/debug/catenary dist/target/debug/catenary
          if [ -f target/debug/mockls ]; then
            cp target/debug/mockls dist/target/debug/mockls
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-dist
          path: dist
          retention-days: 1

  conform:
    name: "Conform ${{ matrix.server }}"
    needs: [discover, build]
    if: needs.discover.outputs.empty != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      # rustup stays for the provisions that need a toolchain
      # (rustup-component, cargo-git-locked); no compile happens here.
      - run: rustup show

      - name: Fetch prebuilt harness
        uses: actions/download-artifact@v4
        with:
          name: conformance-dist
          path: dist

      - name: Install prebuilt binaries at their baked paths
        run: |
          set -euo pipefail
          mkdir -p target/debug
          cp dist/target/debug/* target/debug/
          chmod +x target/debug/* dist/conformance_harness

      - name: Provision runtime dependency (${{ matrix.runtime_name }})
        if: matrix.runtime_name == 'jdk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.runtime_version || '21' }}

      # Some servers derive diagnostics from an external linter named in the
      # recipe `note` (bash-ls → shellcheck, ansible-ls → ansible-lint,
      # elm-ls → the elm compiler). Provisioned here so the intentional
      # diagnostic can publish. (These should graduate to structured `runtime`
      # fields.)
      - name: Provision diagnostic dependencies
        run: |
          set -euo pipefail
          case "${{ matrix.server }}" in
            bash-ls)
              sudo apt-get update && sudo apt-get install -y shellcheck ;;
            ansible-ls)
              pipx install ansible-lint || pip install ansible-lint ;;
            elm-ls)
              # The npm `elm` package is a stub whose install SCRIPT
              # downloads the real compiler — dead under --ignore-scripts
              # (run-5 red: elm-ls fine, nothing to compile with). Fetch
              # the pinned compiler binary directly; same no-scripts
              # posture. Pin cross-verified against two independent public
              # pinners (cashapp/hermit-packages elm.hcl, chaotic-aur
              # PKGBUILD).
              rel="releases/download/0.19.1/binary-for-linux-64-bit.gz"
              curl -sSL "https://github.com/elm/compiler/$rel" -o elm.gz
              want="e44af52bb27f725a973478e589d990a6428e115fe1bb14f0"
              want="${want}3833134d6c0f155c"
              actual="$(sha256sum elm.gz | cut -d' ' -f1)"
              if [ "$actual" != "$want" ]; then
                echo "sha256 mismatch for elm compiler"
                echo "  expected $want"
                echo "  actual   $actual"
                exit 1
              fi
              gunzip elm.gz
              chmod +x elm
              bindir="$HOME/.local/bin"; mkdir -p "$bindir"
              mv elm "$bindir/elm"
              echo "$bindir" >> "$GITHUB_PATH"
              # Pre-warm ELM_HOME (elm/core etc. download on first use) so
              # the harness's settle window never carries cold package
              # fetches. The fixture's intentional error makes this exit
              # non-zero — the pre-warm, not the exit code, is the point.
              (cd tests/fixtures/conformance/elm && \
                "$bindir/elm" make src/Main.elm --output=/dev/null || true)
              ;;
            *) echo "no extra diagnostic dependency for ${{ matrix.server }}" ;;
          esac

      - name: Install pinned server (${{ matrix.server }})
        if: matrix.source == 'recipe'
        run: |
          set -euo pipefail
          pkg="${{ matrix.package }}@${{ matrix.version }}"
          want="${{ matrix.hash }}"
          case "${{ matrix.ecosystem }}" in
            npm)
              # npm-tarball-sha512: fetch the exact tarball, verify OUR pinned
              # sha512, then install the verified artifact with
              # --ignore-scripts (install scripts never run).
              tarball="$(npm view "$pkg" dist.tarball)"
              curl -sSL "$tarball" -o pkg.tgz
              digest="$(openssl dgst -sha512 -binary pkg.tgz | base64 -w0)"
              actual="sha512-$digest"
              if [ -n "$want" ] && [ "$actual" != "$want" ]; then
                echo "integrity mismatch for $pkg"
                echo "  expected $want"
                echo "  actual   $actual"
                exit 1
              fi
              npm install -g --ignore-scripts ./pkg.tgz
              ;;
            cargo)
              cargo install "${{ matrix.package }}" --locked \
                --version "${{ matrix.version }}"
              ;;
            pip)
              if [ -n "$want" ]; then
                printf '%s --hash=sha256:%s\n' "$pkg" "$want" \
                  | sed 's/@/==/' > req.txt
                pip install --require-hashes -r req.txt
              else
                pip install "${{ matrix.package }}==${{ matrix.version }}"
              fi
              ;;
            go)
              go install "$pkg"
              echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
              ;;
            *)
              echo "unknown ecosystem: ${{ matrix.ecosystem }}"; exit 1 ;;
          esac

      # CI-only provisioning (tui-rework 10): obtain a server that no user-grade
      # ecosystem recipe can carry. One branch per provisioning `kind`. Pending
      # stanzas never reach here — conformance_matrix.py drops them (an
      # unresolved pin can't be installed).
      - name: Provision server (${{ matrix.kind }} ${{ matrix.server }})
        if: matrix.source == 'provision'
        run: |
          set -euo pipefail
          case "${{ matrix.kind }}" in
            rustup-component)
              # Rides the pinned toolchain; the component adds the binary.
              rustup component add "${{ matrix.component }}"
              # The ~/.cargo/bin proxy shim resolves the DEFAULT toolchain
              # outside the repo (the bridge spawns servers in a tempdir),
              # where the component is absent — put the real binary first
              # on PATH (GITHUB_PATH prepends).
              real="$(rustup which "${{ matrix.component }}")"
              bindir="$HOME/.local/bin"; mkdir -p "$bindir"
              ln -sf "$real" "$bindir/${{ matrix.component }}"
              echo "$bindir" >> "$GITHUB_PATH"
              ;;
            system-apt)
              sudo apt-get update && sudo apt-get install -y "${{ matrix.apt }}"
              ;;
            github-release-sha256)
              # Fetch the pinned asset, verify OUR pinned sha256, then place
              # its launcher on PATH under the shipped server command
              # (= basename bin).
              rel="releases/download/${{ matrix.version }}/${{ matrix.asset }}"
              url="https://github.com/${{ matrix.repo }}/$rel"
              curl -sSL "$url" -o asset.dl
              actual="$(sha256sum asset.dl | cut -d' ' -f1)"
              if [ "$actual" != "${{ matrix.sha256 }}" ]; then
                echo "sha256 mismatch for ${{ matrix.asset }}"
                echo "  expected ${{ matrix.sha256 }}"
                echo "  actual   $actual"
                exit 1
              fi
              binrel="${{ matrix.bin }}"
              dest="$HOME/.provision/${{ matrix.server }}"
              mkdir -p "$dest"
              case "${{ matrix.asset }}" in
                *.tar.gz|*.tgz) tar -xzf asset.dl -C "$dest" ;;
                *.zip)          unzip -q asset.dl -d "$dest" ;;
                # Anything else is a bare binary.
                *)              cp asset.dl "$dest/$binrel" ;;
              esac
              chmod +x "$dest/$binrel"
              bindir="$HOME/.local/bin"; mkdir -p "$bindir"
              ln -sf "$dest/$binrel" "$bindir/$(basename "$binrel")"
              echo "$bindir" >> "$GITHUB_PATH"
              ;;
            cargo-git-locked)
              # Reproducible source build pinned to an exact commit.
              cargo install --git "${{ matrix.git }}" --locked \
                --rev "${{ matrix.rev }}" "${{ matrix.server }}"
              ;;
            tarball-sha256)
              url="${{ matrix.url }}"
              curl -sSL "$url" -o asset.dl
              actual="$(sha256sum asset.dl | cut -d' ' -f1)"
              if [ "$actual" != "${{ matrix.sha256 }}" ]; then
                echo "sha256 mismatch for $url"; exit 1
              fi
              binrel="${{ matrix.bin }}"
              dest="$HOME/.provision/${{ matrix.server }}"
              mkdir -p "$dest"
              tar -xzf asset.dl -C "$dest"
              bindir="$HOME/.local/bin"; mkdir -p "$bindir"
              ln -sf "$dest/$binrel" "$bindir/$(basename "$binrel")"
              echo "$bindir" >> "$GITHUB_PATH"
              ;;
            gem)
              # RubyGems carries no npm-grade integrity — the exact-version
              # pin plus RubyGems' index is the verification (recorded
              # honestly). --user-install: the runner's system gem dir is
              # root-owned (first dispatch failed on it).
              gem install "${{ matrix.gem }}" --user-install \
                --version "${{ matrix.version }}"
              # ruby-lsp's launcher composes its bundle via `bundle`
              # (run-8 stderr: "sh: 1: bundle: not found" → Errno::ENOENT
              # death). Provision bundler into the same user gem dir.
              gem install bundler --user-install
              userbin="$(ruby -e 'puts Gem.user_dir')/bin"
              echo "$userbin" >> "$GITHUB_PATH"
              # The runner's RubyGems derives Gem.user_dir from
              # XDG_DATA_HOME, which the harness's isolate_env re-points
              # at the test tempdir — the spawned server then can't find
              # its own gems (run-5 red: instant GemNotFoundException).
              # GEM_PATH survives isolate_env (only CATENARY_* is
              # cleared), so the lookup holds wherever XDG points.
              echo "GEM_PATH=$(ruby -e 'puts Gem.user_dir')" \
                >> "$GITHUB_ENV"
              ;;
            *)
              echo "unknown provisioning kind: ${{ matrix.kind }}"; exit 1 ;;
          esac

      - name: Run conformance harness (${{ matrix.server }})
        env:
          CATENARY_CONFORMANCE: ${{ matrix.server }}
          # Pin the harness tempdirs somewhere uploadable, and keep them
          # past Drop/panic-unwind (run 6 uploaded ZERO artifacts: every
          # log lived in a TempDir wiped during unwind before the upload
          # step ran).
          TMPDIR: ${{ runner.temp }}/conformance
          CATENARY_CONFORMANCE_KEEP: "1"
        # The prebuilt libtest binary runs directly — no toolchain, no
        # compile. ONLY the matrix entry point runs: the per-server
        # skip-if-missing sentinels are for local dev, and on runners the
        # rustup proxy shim (~/.cargo/bin/rust-analyzer, no component behind
        # it) defeats their binary-missing skip — the second dispatch failed
        # all 23 harness jobs on that one poisoned sentinel.
        run: |
          mkdir -p "$TMPDIR"
          ./dist/conformance_harness conformance_selected_server

      # The server's own stderr is NOT bridge_stderr.log — it is piped into
      # the daemon and re-emitted as `lsp.stderr` events in the JSONL
      # firehose (under the tempdir's cache base); the daemon's stderr goes
      # to state/catenary/daemon.log. Bundle all three log families into ONE
      # tarball first: run 7's direct upload got to "7 files" and then
      # upload-artifact v4 hard-errored on the firehose instance dir
      # `daemon:<uuid>` (colon is NTFS-invalid; bug 86) and aborted the
      # whole artifact. A tarball is immune to any filename characters.
      - name: Bundle triage logs (failure only)
        if: failure()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/conformance" 2>/dev/null || exit 0
          find . \( -name 'daemon.log' -o -name '*.jsonl' \
            -o -name 'bridge_stderr*.log' \) -print0 \
            | tar -czf "$RUNNER_TEMP/triage.tgz" --null -T -

      - name: Upload triage logs (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: triage-${{ matrix.server }}
          path: ${{ runner.temp }}/triage.tgz
          if-no-files-found: ignore
          retention-days: 7

      - name: Emit blessed entry
        run: |
          set -euo pipefail
          mkdir -p blessed
          # Host-riding provisions (rustup component, apt) carry no pin
          # version; capture the actually-conformed version from the binary
          # so the candidate manifest is honest.
          ver="${{ matrix.version }}"
          if [ -z "$ver" ]; then
            case "${{ matrix.server }}" in
              rust-analyzer)
                ra="rustup run stable rust-analyzer"
                ver="$($ra --version 2>/dev/null | head -1 || true)" ;;
              clangd)
                ver="$(clangd --version 2>/dev/null | head -1 || true)" ;;
              *) ver="unknown" ;;
            esac
          fi
          cat > "blessed/${{ matrix.server }}.toml" <<EOF
          [blessed.${{ matrix.server }}]
          version = "$ver"
          platform = "linux-x86_64"
          date = "$(date -u +%Y-%m-%d)"
          tier = "verified-on-linux"
          EOF
          cat "blessed/${{ matrix.server }}.toml"

      - name: Upload blessed entry
        uses: actions/upload-artifact@v4
        with:
          name: blessed-${{ matrix.server }}
          path: blessed/${{ matrix.server }}.toml
          retention-days: 7

  bless:
    name: Assemble blessed-manifest
    needs: [discover, conform]
    # Assemble whatever conformed: a red server simply has no entry to
    # download, so a partial matrix still yields its candidate manifest
    # (first live run: one red job silently skipped all 23 green blessings).
    # Skip only on cancellation or an empty matrix.
    if: ${{ !cancelled() && needs.discover.outputs.empty != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download conformed entries
        uses: actions/download-artifact@v4
        with:
          pattern: blessed-*
          path: entries
          merge-multiple: true

      - name: Assemble candidate manifest
        run: |
          set -euo pipefail
          # Start from the committed manifest's header comment, then append
          # every entry that conformed green this run. This is a CANDIDATE
          # artifact for review — nothing is pushed; the maintainer blesses
          # by committing the conformed entries into
          # defaults/blessed-manifest.toml in the PR.
          out=candidate-blessed-manifest.toml
          sed -n '/^#/p' defaults/blessed-manifest.toml > "$out"
          echo >> "$out"
          for f in $(find entries -name '*.toml' | sort); do
            cat "$f" >> "$out"
            echo >> "$out"
          done
          # shellcheck disable=SC2016 # literal markdown backticks, no expansion
          {
            echo '## Candidate blessed-manifest (this run)';
            echo '';
            echo 'Copy the conformed entries below into';
            echo '`defaults/blessed-manifest.toml` to bless them — nothing';
            echo 'is pushed automatically.';
            echo '';
            echo '```toml';
            cat "$out";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate manifest
        uses: actions/upload-artifact@v4
        with:
          name: candidate-blessed-manifest
          path: candidate-blessed-manifest.toml
          retention-days: 30
