---
# CD — on a vX.Y.Z tag push:
#   1. build-release   cross-platform binaries (Linux / macOS arm64).
#                      No Intel-mac asset: the macOS proof surface (CI
#                      test leg, conformance, on-device smoke) is
#                      arm64-only per the misc-164 arm-only ruling —
#                      macOS 27 is Apple-silicon-exclusive — and the
#                      shipped surface must match the proven one. No
#                      Windows asset (v2.0.0 ruling, same principle):
#                      nothing in CI compiles Windows, catenary-mcp's
#                      transport is Unix-socket-bound, and the v2.0.0
#                      tag build proved it doesn't even build — Windows
#                      returns post-v2 behind the port.
#   2. create-release  cut a GitHub Release with the binaries attached
#   3. publish-crate   publish to crates.io via Trusted Publishing (OIDC — no
#                      stored token), in dependency order: catenary-proc, then
#                      catenary-mcp (the bridge crate), then the catenary-cli
#                      root. A workspace-wide fail-not-skip backstop (ws41-03)
#                      runs first, so an unbumped content drift reds the release
#                      instead of hiding behind a skip.
#   4. notify-distribution  dispatch the distribution repos (pkgbuilds,
#                      homebrew-tap, scoop-bucket) so packaging starts
#                      immediately instead of on their next poll
#
# Triggered ONLY by tag pushes (which require write access), so a fork PR can
# never trigger it — the publish credential is never exposed to untrusted code.
#
# Crates published: `catenary-proc` and `catenary-mcp` (the bridge crate) —
# both workspace members — and `catenary-cli`, the root package that provides
# the `catenary` binary and depends on the other two by path (so they must
# publish first). There is no `catenary-ts`.
#
# One-time setup before the first Trusted-Publishing run:
#   - crates.io → for EACH published crate (`catenary-proc`, `catenary-mcp`,
#     AND `catenary-cli`):
#       crate Settings → Trusted Publishing → add a publisher with
#         repository   TwoWells/Catenary
#         workflow     cd.yml
#         environment  release
#   - GitHub → repo Settings → Environments → create `release` (optionally
#       add required-reviewer / tag-protection rules). If skipped, GitHub
#       auto-creates it (unprotected) on first run.
#   - After the first successful run, the old `CRATES_IO_TOKEN` repo secret
#     is no longer used and can be deleted.
name: CD

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # create-release: cut the GitHub Release
  id-token: write  # publish-crate: OIDC for crates.io Trusted Publishing

jobs:
  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: catenary
            asset_name: catenary-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: catenary
            asset_name: catenary-macos-arm64

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename and Prepare Asset
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          cp ${{ matrix.artifact_name }} ../../../${{ matrix.asset_name }}

      # A .sha256 sidecar per asset (`<name>.sha256`, `sha256sum -c`-able
      # format) so downstream pinners — the homebrew-tap bump automation, the
      # pkgbuilds watcher — read the hash instead of downloading and hashing
      # the asset. macOS runners have no sha256sum; shasum -a 256 emits the
      # identical format.
      - name: Write sha256 sidecar
        shell: bash
        run: |
          asset="${{ matrix.asset_name }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          cat "$asset.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  create-release:
    name: Create Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The source-of-trust asset for downstream SOURCE builds (pkgbuilds'
      # catenary source package): GitHub's codeload archive bytes are not
      # guaranteed stable and no authoritative hash for them is published
      # anywhere, so the release freezes its own tarball at upload and ships
      # the same .sha256 sidecar the binary assets carry. The prefix keeps
      # the codeload layout (Catenary-<ver>/) so pkgbuilds only swaps its
      # source URL. git archive of the tag contains Cargo.lock, so the
      # --locked source build works from this tarball exactly as from
      # codeload. The homebrew-tap bump keys on explicit platform asset
      # names (darwin_asset/linux_asset), so the new asset cannot confuse
      # it; scoop-bucket carries no catenary manifest.
      - name: Package Source Tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz \
            --prefix="Catenary-${version}/" \
            -o "artifacts/catenary-src-${version}.tar.gz" \
            "$GITHUB_REF_NAME"
          sha256sum "artifacts/catenary-src-${version}.tar.gz" \
            > "artifacts/catenary-src-${version}.tar.gz.sha256"
          cat "artifacts/catenary-src-${version}.tar.gz.sha256"

      - name: Create Release
        run: >-
          gh release create "${{ github.ref_name }}" artifacts/*
          --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  publish-crate:
    name: Publish to crates.io (Trusted Publishing)
    needs: build-release
    runs-on: ubuntu-latest
    # Must match the Environment registered in crates.io Trusted Publishing.
    # Scopes the OIDC token's subject to this environment and is the hook
    # for required-reviewer / tag-protection rules (Settings → Environments).
    environment: release
    steps:
      - uses: actions/checkout@v5
      - run: rustup show

      # OIDC: exchange the GitHub id-token for a short-lived crates.io token.
      # Nothing long-lived is stored in secrets or on the runner. Requires the
      # Trusted Publishing config above on ALL THREE published crates
      # (catenary-proc, catenary-mcp, catenary-cli); one minted token then
      # authorizes publishing all of them.
      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # ws41-03: the fail-not-skip, WORKSPACE-WIDE publish backstop. Runs BEFORE
      # any publish. crates.io protects the registry entry, never the version
      # claim compiled into a binary via a path dep, so the publish step below
      # legitimately SKIPS an already-published version (`|| echo skipping`) —
      # but that skip is safe ONLY when the content is byte-identical to what is
      # published. This backstop reds the release when any published crate's
      # content differs from its already-published version WITHOUT a bump
      # (catenary-proc included, not just the bridge crate), so drift can never
      # hide behind the skip. Read-only: it hits the sparse index and the static
      # CDN, never publishes.
      - name: Publish backstop (fail on unbumped content drift)
        run: make publish-backstop

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # Workspace subcrates first, in dependency order; skip only if the
          # version is already published — the backstop above has already failed
          # the run if any of these drifted without a bump, so a reached skip is
          # a genuine identical-content no-op.
          cargo publish -p catenary-proc \
            || echo "catenary-proc: already published, skipping"
          cargo publish -p catenary-mcp \
            || echo "catenary-mcp: already published, skipping"
          # Wait for the crates.io index to propagate before the dependent root
          # crate resolves its just-published path deps.
          sleep 30
          # Root package (catenary-cli — the `catenary` binary).
          cargo publish --allow-dirty

  # Push, don't poll: nudge the distribution repos so packaging starts now
  # instead of on their next scheduled poll. Each dispatched workflow is an
  # idempotent no-op when nothing newer has shipped, and each keeps its
  # schedule as a fallback — so a missing or expired DIST_DISPATCH_TOKEN
  # (fine-grained PATs cap at 1 year) degrades to polling, never a red
  # release. The token is a TwoWells org secret (fine-grained PAT,
  # Actions: write on exactly these three repos), shared with each upstream
  # that ships releases. scoop-bucket carries no catenary manifest (no
  # Windows asset), so its dispatch is a no-op — kept anyway so this job
  # stays copy-paste identical across the TwoWells upstreams.
  notify-distribution:
    name: Notify Distribution Repos
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch distribution watchers
        env:
          GH_TOKEN: ${{ secrets.DIST_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DIST_DISPATCH_TOKEN unset — falling back to scheduled polls."
            exit 0
          fi
          gh workflow run watch.yml --repo TwoWells/pkgbuilds
          gh workflow run bump.yml --repo TwoWells/homebrew-tap
          gh workflow run bump.yml --repo TwoWells/scoop-bucket
