---
# CD — on a vX.Y.Z tag push:
#   1. build-release   cross-platform binaries (Linux / macOS x64+arm64 /
#                      Windows)
#   2. create-release  cut a GitHub Release with the binaries attached
#   3. publish-crate   publish to crates.io via Trusted Publishing (OIDC — no
#                      stored token): catenary-proc, then catenary-mcp
#
# Triggered ONLY by tag pushes (which require write access), so a fork PR can
# never trigger it — the publish credential is never exposed to untrusted code.
#
# Crates published: `catenary-proc` (workspace member) and `catenary-mcp` (the
# root package — provides the `catenary` binary). There is no `catenary-ts`.
#
# One-time setup before the first Trusted-Publishing run:
#   - crates.io → for EACH crate (`catenary-mcp` AND `catenary-proc`):
#       crate Settings → Trusted Publishing → add a publisher with
#         repository   TwoWells/Catenary
#         workflow     cd.yml
#         environment  release
#   - GitHub → repo Settings → Environments → create `release` (optionally
#       add required-reviewer / tag-protection rules). If skipped, GitHub
#       auto-creates it (unprotected) on first run.
#   - After the first successful run, the old `CRATES_IO_TOKEN` repo secret
#     is no longer used and can be deleted.
name: CD

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # create-release: cut the GitHub Release
  id-token: write  # publish-crate: OIDC for crates.io Trusted Publishing

jobs:
  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: catenary
            asset_name: catenary-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: catenary
            asset_name: catenary-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: catenary
            asset_name: catenary-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: catenary.exe
            asset_name: catenary-windows-amd64.exe

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename and Prepare Asset
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          cp ${{ matrix.artifact_name }} ../../../${{ matrix.asset_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  create-release:
    name: Create Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        run: >-
          gh release create "${{ github.ref_name }}" artifacts/*
          --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  publish-crate:
    name: Publish to crates.io (Trusted Publishing)
    needs: build-release
    runs-on: ubuntu-latest
    # Must match the Environment registered in crates.io Trusted Publishing.
    # Scopes the OIDC token's subject to this environment and is the hook
    # for required-reviewer / tag-protection rules (Settings → Environments).
    environment: release
    steps:
      - uses: actions/checkout@v5
      - run: rustup show

      # OIDC: exchange the GitHub id-token for a short-lived crates.io token.
      # Nothing long-lived is stored in secrets or on the runner. Requires the
      # Trusted Publishing config above on BOTH catenary-mcp and catenary-proc;
      # one minted token then authorizes publishing both.
      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # Workspace subcrate first; skip if its version is already
          # published.
          cargo publish -p catenary-proc \
            || echo "catenary-proc: already published, skipping"
          # Wait for the crates.io index to propagate before the dependent
          # crate.
          sleep 30
          # Root package (catenary-mcp).
          cargo publish --allow-dirty
