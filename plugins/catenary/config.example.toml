# Catenary Configuration
# Copy to ~/.config/catenary/config.toml and customize
#
# At startup Catenary scans the workspace and only spawns servers for
# languages it detects. Undetected servers start on first file access.
# Feel free to add many servers without overhead.

# ─────────────────────────────────────────────────────────────────────
# Server / language split
# ─────────────────────────────────────────────────────────────────────
#
# LSP configuration lives under the [lsp] table in two sub-sections:
#
#   [lsp.server.<name>]        — defines HOW to run a language server
#   # the section key IS the binary Catenary spawns; add `path = "/abs/path"`
#   # only to relocate a binary that is not on PATH.
#   args    = ["arg1", "arg2"]
#
#   [lsp.language.<language-id>]   — BINDS a language to one or more servers
#   servers = ["<name>"]
#
# The language-id should match the LSP language identifier (e.g., "rust",
# "python", "typescript"). Catenary routes requests based on file
# extension, filename, and shebang.
#
# Built-in defaults cover ~25 common language servers and their bindings,
# so most setups need no config at all — if the server binary is on PATH
# and the language has a default binding, LSP intelligence just works.
# Run `catenary config` to see the full list of built-in servers.
#
# A user-defined [lsp.server.X] completely replaces the built-in default for
# X — no merging. You only need config to customize: initialization
# options, settings, env, custom binaries, or new servers.

# ─────────────────────────────────────────────────────────────────────
# Overriding a built-in server
# ─────────────────────────────────────────────────────────────────────
#
# Built-in rust/python/typescript/go/c/cpp bindings already work, so the
# [lsp.language.*] bindings below are optional — the defaults already supply
# them. They are spelled out here to show the split: a [lsp.server.*]
# definition paired with a [lsp.language.*] binding that references it by name.

# Strip lint URLs from rust-analyzer diagnostics (saves agent context),
# and run clippy on save.
[lsp.server.rust-analyzer]
env = { CLIPPY_DISABLE_DOCS_LINKS = "1" }

[lsp.server.rust-analyzer.initialization_options]
check.command = "clippy"

[lsp.language.rust]
servers = ["rust-analyzer"]

# Server settings are returned in workspace/configuration responses. The
# TOML nesting mirrors the JSON object the server expects. A user-defined
# [lsp.server.X] fully replaces the built-in, so repeat args/settings when you
# customize.
[lsp.server.pyright-langserver]
args = ["--stdio"]

[lsp.server.pyright-langserver.settings.python.analysis]
exclude = ["**/target", "**/node_modules"]

[lsp.language.python]
servers = ["pyright-langserver"]

# ─────────────────────────────────────────────────────────────────────
# Variant languages
# ─────────────────────────────────────────────────────────────────────
#
# There is no `inherit` field. To make a variant language use the same
# servers as a base language, copy the base language's `servers` list
# into the variant binding. (typescriptreact and javascriptreact already
# bind to typescript-language-server in the built-in defaults — this is only
# needed when you define your own variant.)
#
# [lsp.language.typescript]
# servers = ["typescript-language-server"]
#
# [lsp.language.typescriptreact]
# servers = ["typescript-language-server"]   # same list as typescript

# ─────────────────────────────────────────────────────────────────────
# Defining a server from scratch
# ─────────────────────────────────────────────────────────────────────
#
# For a server without a built-in default, define [lsp.server.*] and bind it
# from [lsp.language.*]:
#
# [lsp.server.phpactor]
# args = ["language-server"]
#
# [lsp.language.php]
# servers = ["phpactor"]

# ─────────────────────────────────────────────────────────────────────
# Markdown — Lattice
# ─────────────────────────────────────────────────────────────────────
#
# Markdown defaults to Lattice (https://github.com/TwoWells/Lattice), a
# Two Wells sibling project shipped as an LSP server. The built-in
# [lsp.server.lattice] definition handles it automatically. To re-enable
# marksman instead, bind it (marksman stays defined in the built-in
# defaults):
#
# [lsp.language.markdown]
# servers = ["marksman"]

# ─────────────────────────────────────────────────────────────────────
# Additional servers (uncomment as needed)
# ─────────────────────────────────────────────────────────────────────
#
# These all ship as built-in [lsp.server.*] defaults and built-in
# [lsp.language.*] bindings — uncomment and customize only to override.

# [lsp.server.bash-language-server]
# args = ["start"]
# single_file = true            # also serve files outside any workspace root
#
# [lsp.language.shellscript]
# servers = ["bash-language-server"]

# [lsp.server.yaml-language-server]
# args = ["--stdio"]
#
# [lsp.language.yaml]
# servers = ["yaml-language-server"]

# [lsp.server.taplo]
# args = ["lsp", "stdio"]
#
# [lsp.language.toml]
# servers = ["taplo"]

# [lsp.server.lua-language-server]
# # no config needed — the key `lua-language-server` is the binary on PATH
#
# [lsp.language.lua]
# servers = ["lua-language-server"]

# [lsp.server.zls]
# # no config needed — the key `zls` is the binary on PATH
#
# [lsp.language.zig]
# servers = ["zls"]
