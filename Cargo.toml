[workspace]
members = ["crates/catenary-proc"]

[package]
name = "catenary-mcp"
version = "1.6.1"
edition = "2024"
license = "AGPL-3.0-or-later"
default-run = "catenary"
description = "A high-performance multiplexing bridge between MCP (Model Context Protocol) and LSP (Language Server Protocol). Enables LLMs to access IDE-grade code intelligence across multiple languages simultaneously with smart routing and UTF-8 accuracy."
repository = "https://github.com/TwoWells/Catenary"
documentation = "https://twowells.github.io/catenary/"
keywords = ["mcp", "lsp", "language-server", "llm", "ai"]
categories = ["development-tools"]

[lints]
workspace = true

[[bin]]
name = "catenary"
path = "src/main.rs"

[[bin]]
name = "mockls"
path = "tools/mockls.rs"
required-features = ["mockls"]

[[bin]]
name = "mockc"
path = "tools/mockc.rs"
required-features = ["mockls"]

[[bench]]
name = "logging_overhead"
harness = false

[features]
mockls = []

[dependencies]
catenary-proc = { path = "crates/catenary-proc", version = "0.1.0" }
anyhow = "1.0.100"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
toml = "0.9.11"
crossterm = "0.28"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_28"] }
dirs = "6.0.0"
futures = "0.3"
globset = "0.4"
grep-matcher = "0.1.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
ignore = "0.4.25"
memchr = "2"
notify = "8"
os_pipe = "1"
regex = "1.10"
rusqlite = { version = "0.34", features = ["bundled", "functions"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
similar = "2.6"
tempfile = "3"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
unicode-width = "0.2"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Lint groups
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Hard denials — no agent should produce these
unwrap_used = "deny"
expect_used = "deny" # test modules opt out via #[allow(clippy::expect_used)]
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
wildcard_imports = "deny"

# Force agents to justify exceptions
allow_attributes_without_reason = "deny"

# Dependencies
multiple_crate_versions = "allow"

# Documentation
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
