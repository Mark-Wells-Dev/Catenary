[workspace]
members = ["crates/catenary-proc"]
# The cargo-fuzz crate (tokenizer ticket 06) is its own detached workspace
# (`fuzz/Cargo.toml` declares `[workspace]`) and requires the nightly toolchain +
# `libfuzzer-sys`. Excluded here so the stable `make check` run, `cargo deny`, and
# `cargo machete` never descend into it — the fuzz soak is out-of-band (see
# `fuzz/README.md` / `make fuzz`).
# `tests/fixtures/rust_repo` is the opt-in real-rust-analyzer eyeball fixture
# (ticket 00c, `make rustgrep`/`make rustglob`). It is a standalone crate that
# only rust-analyzer ever compiles; excluding it keeps every workspace `cargo`
# invocation (`make check`, `cargo deny`, `cargo machete`) from descending into a
# nested non-member package. `tests/fixtures/conformance/rust` is the same
# story for the conformance harness (tui-rework 07): a standalone crate only
# rust-analyzer compiles, so it is excluded for the identical reason.
exclude = ["fuzz", "tests/fixtures/rust_repo", "tests/fixtures/conformance/rust"]

[package]
name = "catenary-mcp"
version = "2.0.2"
edition = "2024"
license = "AGPL-3.0-or-later"
default-run = "catenary"
description = "A high-performance multiplexing bridge between MCP (Model Context Protocol) and LSP (Language Server Protocol). Enables LLMs to access IDE-grade code intelligence across multiple languages simultaneously with smart routing and UTF-8 accuracy."
repository = "https://github.com/TwoWells/Catenary"
documentation = "https://twowells.github.io/catenary/"
keywords = ["mcp", "lsp", "language-server", "llm", "ai"]
categories = ["development-tools"]

[lints]
workspace = true

[[bin]]
name = "catenary"
path = "src/main.rs"

[[bin]]
name = "mockls"
path = "tools/mockls.rs"
required-features = ["mockls"]

[[bin]]
name = "mockc"
path = "tools/mockc.rs"
required-features = ["mockls"]

[[bin]]
name = "mocklint"
path = "tools/mocklint.rs"
required-features = ["mockls"]

[[bench]]
name = "logging_overhead"
harness = false

[features]
mockls = []
# Exposes the differential oracle (`cli::command_filter::oracle::check`) and pulls
# in the `brush-parser` reference parse, so the out-of-tree `fuzz/` crate
# (tokenizer ticket 06) can reuse the same `check()` the `proptest` layer drives.
# Off by default and never enabled by the shipped build or `make check`, so
# `brush-parser` stays out of the runtime / `cargo deny` graph. The `proptest`
# layer reaches the oracle through `cfg(test)` instead, so stable CI needs no
# feature flag.
fuzzing = ["dep:brush-parser"]

[dependencies]
catenary-proc = { path = "crates/catenary-proc", version = "0.2.0" }
anyhow = "1.0.100"
# `brush-parser` is the bash-fidelity reference parse for the differential oracle
# (tokenizer ticket 05). It is **optional** and only activated by the `fuzzing`
# feature, which the shipped build and `make check` never enable — so it never
# enters the runtime / `cargo deny` graph and never ships. The `proptest` layer
# reaches it through the `[dev-dependencies]` copy below under `cfg(test)`; the
# out-of-tree `fuzz/` crate reaches it through this optional dep + `fuzzing`.
brush-parser = { version = "0.4.0", optional = true }
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
toml = "0.9.11"
# `toml_edit` powers the guided-mutation writer (tui-rework 05): format-preserving
# surgical edits to config files so a hand-formatted config keeps its comments and
# layout outside the one key a fix-it changes. The `spec-1.1.0` generation
# (0.25.x) shares every transitive crate with `toml` 0.9 (toml_datetime /
# toml_parser / toml_writer / serde_spanned / winnow 0.7), so it adds no new
# version to the graph. MIT OR Apache-2.0 — deny.toml-clean.
toml_edit = "0.25"
crossterm = "0.28"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_28"] }
dirs = "6.0.0"
# `ed25519-dalek` verifies the detached signature on the fetched registry
# artifact (tui-rework 08). The trust root (public key) ships in-binary; a bad
# signature is a loud finding and the loader degrades to the cached/seed
# registry — never to unpinned behaviour. Signature verification is NEVER
# hand-rolled (a hard rule): this is the audited, reference ed25519
# implementation. BSD-3-Clause; its transitive crypto crates (curve25519-dalek
# BSD-3-Clause, ed25519 / sha2 / signature / subtle / zeroize under MIT OR
# Apache-2.0) are all deny.toml-clean. Production uses `VerifyingKey`; tests
# derive an ephemeral keypair from a fixed seed (`SigningKey::from_bytes`) — no
# real key, no RNG, no network.
ed25519-dalek = "2"
futures = "0.3"
globset = "0.4"
grep-matcher = "0.1.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
ignore = "0.4.25"
memchr = "2"
notify = "8"
os_pipe = "1"
regex = "1.10"
# `schemars` derives the JSON Schema for Catenary's config files (misc 133) from
# the same serde structs the loader deserializes, so the shipped `schemas/*.json`
# artifacts cannot drift from the runtime shape (byte-for-byte freshness gate in
# `src/config/schema.rs`). A plain dependency: the derives ride the non-test
# config structs and the generator path runs under the default-feature test set,
# so `cargo machete` sees it and `make check` exercises the freshness gate.
schemars = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
similar = "2.6"
tempfile = "3"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
unicode-width = "0.2"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Differential fuzzing oracle for the shell-command parser (tokenizer ticket 05).
# `brush-parser` is the bash-fidelity reference parse; `proptest` drives the
# stable-CI differential. Both are dev-only — they never enter the runtime /
# `cargo deny` *runtime* graph and never ship. `brush-parser` is also declared as
# an `optional` regular dependency above so the out-of-tree `fuzz/` crate can pull
# it in via the `fuzzing` feature; this dev-dependency copy is what lets the
# `cfg(test)` `proptest` layer reach the oracle with no feature flag.
brush-parser = "0.4.0"
# `filetime` forces a file's mtime back to an earlier value so the SymbolIndex
# same-second-slip test can rewrite content while pinning the mtime equal —
# proving the content-hash staleness leg catches a write the mtime backstop
# misses (misc 190). Dev-only: it never enters the runtime / `cargo deny`
# *runtime* graph and never ships. MIT OR Apache-2.0 — deny.toml-clean; its
# transitive deps (cfg-if, libc, windows-sys) are all already in-tree, so it
# adds only itself.
filetime = "0.2"
proptest = "1.11"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Lint groups
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Hard denials — no agent should produce these
unwrap_used = "deny"
expect_used = "deny" # test modules opt out via #[allow(clippy::expect_used)]
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
wildcard_imports = "deny"

# Force agents to justify exceptions
allow_attributes_without_reason = "deny"

# Dependencies
multiple_crate_versions = "allow"

# Documentation
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
